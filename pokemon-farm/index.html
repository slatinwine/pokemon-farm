<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宝可梦农场 · 百变怪的农庄</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1100px 700px at 50% 25%, #2c4a3a, #101c14 75%);
    display:flex;align-items:center;justify-content:center;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#f5ecd7; overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  #wrap{
    position:relative; width:min(97vw,960px); aspect-ratio:3/2;
    border-radius:12px; overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,.65);
    border:3px solid #2b3a20; background:#7ec8f0;
  }
  canvas{width:100%;height:100%;display:block;cursor:crosshair}
  /* ---------- 天气/色调 ---------- */
  #fx{position:absolute;inset:0;pointer-events:none;z-index:4}
  #rain{position:absolute;inset:0;pointer-events:none;z-index:4;display:none;opacity:.55;
    background-image:repeating-linear-gradient(115deg, transparent 0 5px, rgba(180,200,240,.75) 5px 6px, transparent 6px 12px);
    animation:rainMove .35s linear infinite}
  @keyframes rainMove{to{background-position:-130px 0}}
  #snow{position:absolute;inset:0;pointer-events:none;z-index:4;display:none;opacity:.9;
    background-image:radial-gradient(circle at 20% 30%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 70% 60%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 40% 80%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 85% 15%, #fff 0 2px, transparent 3px);
    background-size:240px 240px; animation:snowDrift 4s linear infinite}
  @keyframes snowDrift{to{background-position:60px 120px}}
  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;z-index:5}
  #topbar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:10px;flex-wrap:wrap;
    background:rgba(20,28,12,.62);border:2px solid rgba(255,215,94,.35);border-radius:10px;
    padding:6px 12px;font-size:15px;font-weight:600;letter-spacing:.5px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  #topbar .sp{flex:1}
  #hud-gold{color:#ffd75e}
  #hud-save{opacity:0;transition:opacity .5s;font-size:13px}
  #energybar{position:absolute;left:8px;top:62px;width:210px;height:26px;border-radius:13px;
    background:rgba(20,14,6,.72);border:2px solid rgba(255,215,94,.4);overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  #energyfill{height:100%;width:100%;background:linear-gradient(180deg,#ffe08a,#ffb52e);transition:width .25s}
  #energytxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#4a2e08;text-shadow:0 1px 0 rgba(255,255,255,.35)}
  #formbar{position:absolute;left:8px;top:94px;background:rgba(20,28,12,.72);border:2px solid rgba(255,215,94,.4);
    border-radius:10px;padding:4px 12px;font-size:13px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  #hotbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;
    background:rgba(20,28,12,.72);border:2px solid rgba(255,215,94,.4);padding:6px;border-radius:12px;
    box-shadow:0 4px 14px rgba(0,0,0,.4);pointer-events:auto}
  .slot{width:52px;height:52px;border-radius:8px;border:2px solid #4a3a1e;background:#6a522b;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:22px;color:#fff;cursor:pointer;
    position:relative;transition:transform .08s}
  .slot .nm{position:absolute;bottom:1px;font-size:10px;font-weight:700;color:#ffe9b0;text-shadow:0 1px 2px #000}
  .slot .kb{position:absolute;left:3px;top:2px;font-size:9px;font-weight:700;color:rgba(255,255,255,.65)}
  .slot .cnt{position:absolute;right:3px;top:1px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
  .slot.sel{border-color:#ffd75e;transform:translateY(-4px);box-shadow:0 4px 0 #b8860b}
  .slot:hover{filter:brightness(1.15)}
  #hotbar.compact .slot{width:44px;height:44px;font-size:18px}
  #hotbar.compact .slot .nm{font-size:9px}
  #hint{position:absolute;left:8px;bottom:10px;font-size:12px;color:#efe3c0;background:rgba(20,14,6,.6);
    border-radius:8px;padding:5px 10px;letter-spacing:.3px}
  #toasts{position:absolute;top:66px;right:10px;z-index:8;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .toast{background:rgba(24,16,6,.85);border:1px solid rgba(255,215,94,.45);color:#ffe9b0;padding:6px 12px;
    border-radius:8px;font-size:14px;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.4);animation:toastin .18s ease-out}
  @keyframes toastin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
  #dialog{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,6,2,.5)}
  #dlg-box{width:min(92%,760px);max-height:86%;overflow:auto;background:linear-gradient(180deg,#f8eed6,#ecd9ae);
    color:#4a3018;border:4px solid #6a522b;border-radius:14px;padding:16px 20px;box-shadow:0 16px 50px rgba(0,0,0,.6);
    font-size:16px;line-height:1.7}
  #dlg-box h3{margin:4px 0 10px;color:#7a4a12;font-size:20px;text-align:center}
  #dlg-box textarea{width:100%;height:120px;font-family:Menlo,Consolas,monospace;font-size:11px;line-height:1.4;
    border:2px solid #b89858;border-radius:6px;padding:6px;background:#fffdf5;color:#4a3018;resize:vertical}
  #dlg-actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  button{font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;color:#fdf3dd;background:linear-gradient(180deg,#8a6a3a,#5e4322);
    border:2px solid #3d2c12;border-radius:9px;padding:8px 18px;transition:filter .1s}
  button:hover{filter:brightness(1.18)}
  button.gold{background:linear-gradient(180deg,#ffd75e,#e0a02a);color:#4a2e08;border-color:#a06c12}
  button.ghost{background:rgba(255,255,255,.25);color:#5b3a1e;border-color:#a08050}
  .shop-grid{display:flex;gap:14px;flex-wrap:wrap}
  .shop-grid>div{flex:1;min-width:230px}
  .shop-grid h4{color:#7a4a12;border-bottom:2px solid #d8b878;padding-bottom:4px;margin-bottom:8px}
  .shop-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 6px;border-radius:6px}
  .shop-row:nth-child(odd){background:rgba(200,160,90,.18)}
  .shop-row .nm{flex:1;font-weight:600}
  .shop-row .pr{color:#8a5a10;font-weight:700;white-space:nowrap}
  .shop-row button{padding:4px 10px;font-size:13px}
  #tooltip{position:absolute;z-index:7;pointer-events:none;background:rgba(24,16,6,.88);border:1px solid rgba(255,215,94,.5);
    color:#ffe9b0;padding:4px 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.4)}
  #energybar.low{border-color:#e05a50;animation:elow .9s ease-in-out infinite}
  @keyframes elow{0%,100%{box-shadow:0 3px 10px rgba(0,0,0,.35)}50%{box-shadow:0 0 12px 3px rgba(224,90,80,.6)}}
  .hidden{display:none !important}
  #menu{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(6,4,2,.68);backdrop-filter:blur(2px)}
  #menu-box{width:min(92%,420px);background:linear-gradient(180deg,#2c3a1c,#18240e);border:3px solid #6a522b;border-radius:16px;
    padding:22px 26px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.7)}
  #menu-box h2{color:#ffd75e;font-size:26px;margin-bottom:16px;letter-spacing:2px}
  #menu-box button{display:block;width:100%;margin:8px 0}
  #menu-sub{margin-top:14px;color:#d9c89a;font-size:14px;line-height:1.8;text-align:left;max-height:260px;overflow:auto}
  #menu-ver{margin-top:12px;color:#8a7a5a;font-size:12px;letter-spacing:1px}
  #loading{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,14,6,.85);font-size:16px;text-align:center;line-height:2}
  /* ---------- 产品化：浮动文字 / 转场 / 引导 / 触屏 ---------- */
  #floaters{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
  .floater{position:absolute;transform:translate(-50%,-50%);font-size:15px;font-weight:800;
    color:#ffe08a;text-shadow:0 1px 3px rgba(0,0,0,.55);animation:floatUp 1.25s ease-out forwards;white-space:nowrap}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-260%) scale(1.05)}}
  #fade{position:absolute;inset:0;background:#0a0806;opacity:0;pointer-events:none;z-index:25;transition:opacity .45s}
  #fade.on{opacity:1;pointer-events:auto}
  #guide{position:absolute;left:8px;top:132px;width:238px;z-index:5;pointer-events:none;
    background:rgba(20,28,12,.72);border:2px solid rgba(255,215,94,.4);border-radius:10px;padding:8px 12px;
    font-size:12.5px;line-height:1.9;color:#efe3c0;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:opacity .6s}
  #guide h4{color:#ffd75e;font-size:13px;margin-bottom:2px;letter-spacing:1px}
  #guide .gdone{color:#8fd070;text-decoration:line-through;opacity:.7}
  #guide.out{opacity:0}
  #touchui{position:absolute;inset:0;pointer-events:none;z-index:9}
  #tdpad{position:absolute;left:14px;bottom:64px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
  #tdpad button,#tbtns button{pointer-events:auto;opacity:.55;background:rgba(20,28,12,.75);color:#ffe9b0;
    border:2px solid rgba(255,215,94,.45);border-radius:10px;font-size:19px;font-weight:800;
    display:flex;align-items:center;justify-content:center;touch-action:none}
  #tdpad button:active,#tbtns button:active{opacity:.95;background:rgba(80,60,20,.9)}
  #tbtns{position:absolute;right:14px;bottom:70px;display:flex;flex-direction:column;gap:10px}
  #tbtns button{width:64px;height:64px;border-radius:50%;font-size:15px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>
  <div id="fx"></div>
  <div id="rain"></div>
  <div id="snow"></div>

  <div id="hud">
    <div id="topbar">
      <span id="hud-date">春季 第1天</span>
      <span id="hud-time">06:00</span>
      <span id="hud-weather">☀️ 晴</span>
      <span class="sp"></span>
      <span id="hud-gold">₽ 500</span>
      <span id="hud-save">💾</span>
    </div>
    <div id="energybar"><div id="energyfill"></div><span id="energytxt">体力 100/100</span></div>
    <div id="formbar">变身形态：百变怪</div>
    <div id="hotbar"></div>
    <div id="hint">WASD/方向键 移动 · 空格/左键 使用 · E/右键 互动 · 1-9/滚轮 选物品 · Esc 菜单</div>
  </div>

  <div id="toasts"></div>
  <div id="tooltip" class="hidden"></div>
  <div id="floaters"></div>
  <div id="guide" class="hidden"></div>
  <div id="fade"></div>

  <div id="touchui" class="hidden">
    <div id="tdpad">
      <span></span><button data-k="w">▲</button><span></span>
      <button data-k="a">◀</button><span></span><button data-k="d">▶</button>
      <span></span><button data-k="s">▼</button><span></span>
    </div>
    <div id="tbtns">
      <button data-act="use">使用</button>
      <button data-act="act">互动</button>
    </div>
  </div>

  <div id="dialog" class="hidden">
    <div id="dlg-box"><div id="dlg-text"></div><div id="dlg-actions"></div></div>
  </div>

  <div id="menu" class="hidden">
    <div id="menu-box">
      <h2>⚡ 百变怪的农庄</h2>
      <button data-act="continue" class="gold">继续游戏</button>
      <button data-act="save">💾 保存游戏</button>
      <button data-act="load">📂 读取存档</button>
      <button data-act="export">📤 导出存档</button>
      <button data-act="import">📥 导入存档</button>
      <button data-act="new">🌱 新游戏</button>
      <button data-act="sound">🔊 声音：开</button>
      <button data-act="help">❓ 操作说明</button>
      <button data-act="stats">📊 农场统计</button>
      <div id="menu-sub"></div>
      <div id="menu-ver">🌱 百变怪的农庄 v1.0</div>
    </div>
  </div>

  <div id="loading">正在加载 3D 渲染器…</div>
</div>

<script>
"use strict";
/* =====================================================================
   宝可梦农场 · 百变怪的农庄 (Three.js 2.5D)
   模拟逻辑可独立于 3D 渲染运行（便于测试）；3D 渲染需要加载 Three.js。
   ===================================================================== */

/* ---------------- 常量 ---------------- */
const MAP_W = 48, MAP_H = 36;
const VIEW_W = 960, VIEW_H = 640;
const DAYS_PER_SEASON = 28;
const MAX_ENERGY = 100;
const INV_SLOTS = 9;
const START_GOLD = 500;
const SAVE_KEY = 'pokemon-farm-save-v1';
const SEASON_ORDER = ['spring','summer','fall','winter'];
const SEASON_NAMES = {spring:'春季', summer:'夏季', fall:'秋季', winter:'冬季'};
const SEASON_ICONS = {spring:'🌸', summer:'☀️', fall:'🍁', winter:'❄️'};
const SEASON_COLORS = {spring:'#7daf64', summer:'#658e49', fall:'#b48750', winter:'#dfe8ef'};
const SEASON_GRASS2 = {spring:'#79a85d', summer:'#5e8245', fall:'#a57c4a', winter:'#d5dfe6'};
const WEATHER_NAMES = {sunny:'晴', rain:'雨', snow:'雪'};
const WEATHER_ICONS = {sunny:'☀️', rain:'🌧️', snow:'❄️'};

const T_GRASS=0, T_TILLED=1, T_PATH=2, T_WATER=3, T_FLOOR=4, T_WALL=5;
const D_NONE=0, D_TREE=1, D_STUMP=2, D_ROCK=3, D_TALL=4, D_FLOWER=5;

const HOUSE = {x:10, y:8, w:5, h:4, doorX:12, doorY:11};
const SHOP  = {x:34, y:22, w:2, h:2};
const INT_W = 14, INT_H = 10;
const BED_TILES = [[10,3],[11,3]];
const TABLE_TILES = [[4,4],[4,5]];
const INT_DOOR = [7,9];

const DIRS = [[0,-1],[0,1],[-1,0],[1,0]]; // 上 下 左 右

/* ---------------- 树果 & 物品数据 ---------------- */
const CROPS = {
  oran:   {name:'橙橙果', season:['spring'], days:4, seed:20,  sell:35, energy:10, icon:'🔵', color:'#3a6fd8', berry:0x3a6fd8},
  pecha:  {name:'桃桃果', season:['spring'], days:6, seed:50,  sell:80, energy:15, icon:'🍑', color:'#f2a0c0', berry:0xf2a0c0},
  sitrus: {name:'文柚果', season:['spring'], days:8, seed:100, sell:120,energy:25, icon:'🍋', color:'#f0c838', berry:0xf0c838},
  cheri:  {name:'樱子果', season:['summer'], days:4, seed:20,  sell:35, energy:10, icon:'🍒', color:'#e04848', berry:0xe04848},
  rawst:  {name:'莓莓果', season:['summer'], days:6, seed:50,  sell:80, energy:15, icon:'🫐', color:'#58b8a0', berry:0x58b8a0},
  leppa:  {name:'利木果', season:['summer'], days:8, seed:80,  sell:50, energy:12, icon:'🍇', color:'#b06ad0', berry:0xb06ad0},
  aspear: {name:'木子果', season:['fall'], days:6, seed:50,   sell:90, energy:16, icon:'🍏', color:'#8ac830', berry:0x8ac830},
  persim: {name:'香柚果', season:['fall'], days:10, seed:100, sell:140,energy:22, icon:'🍊', color:'#e88830', berry:0xe88830},
  razz:   {name:'乐芭果', season:['fall'], days:12, seed:120, sell:200,energy:28, icon:'🍓', color:'#d04848', berry:0xd04848},
  snow:   {name:'雪绒果', season:['winter'], days:5, seed:60,  sell:110,energy:18, icon:'⚪', color:'#dce8f4', berry:0xdce8f4},
};

const ITEMS = {};
ITEMS.tool_hoe = {name:'地鼠锄', kind:'tool', icon:'⛏', form:'diglett'};
ITEMS.tool_can = {name:'车厘龟壶', kind:'tool', icon:'💧', form:'squirtle'};
ITEMS.tool_axe = {name:'螳螂镰', kind:'tool', icon:'🗡', form:'scyther'};
ITEMS.tool_pick= {name:'拳石镐', kind:'tool', icon:'👊', form:'geodude'};
for (const id in CROPS){
  const c = CROPS[id];
  ITEMS['seed_'+id] = {name:c.name+'种', kind:'seed', crop:id, icon:'🌱', buy:c.seed};
  ITEMS['crop_'+id] = {name:c.name, kind:'crop', icon:c.icon, sell:c.sell, energy:c.energy};
}
ITEMS.wood  = {name:'木材', kind:'material', icon:'🪵', sell:2};
ITEMS.stone = {name:'石头', kind:'material', icon:'🪨', sell:2};
ITEMS.salad = {name:'哞哞鲜乳', kind:'food', icon:'🥛', sell:50, energy:30, buy:100};
ITEMS.tool_rod = {name:'可达鸭钓竿', kind:'tool', icon:'🎣', form:'psyduck', buy:250};
ITEMS.fish_magikarp = {name:'鲤鱼王', kind:'food', icon:'🐟', sell:30, energy:6};
ITEMS.fish_goldeen   = {name:'角金鱼', kind:'food', icon:'🐠', sell:70, energy:12};
ITEMS.fish_gyarados  = {name:'暴鲤龙', kind:'food', icon:'🐋', sell:600, energy:40};

/* 变身形态中文名 */
const FORM_NAMES = {
  ditto:'百变怪', diglett:'地鼠', squirtle:'车厘龟', scyther:'飞天螳螂',
  geodude:'小拳石', bulbasaur:'妙蛙种子', psyduck:'可达鸭',
  pidgey:'波波', magnemite:'小磁怪', oddish:'走路草',
};

/* ---------------- 技能（商店研习，随成长解锁） ----------------
   req: [统计字段, 需要数值, 展示说明]；null 表示无需解锁条件 */
const SKILLS = {
  dash:      {name:'⚡ 电光一闪', desc:'按住 Shift 冲刺移动（速度×1.6）', cost:500,
              req:null},
  rainring:  {name:'💧 求雨圈', desc:'浇水范围扩大到 3×3', cost:1000,
              req:['watered', 30, '浇灌 30 次']},
  cyclone:   {name:'🌪 旋风刀', desc:'砍树木材翻倍且少耗 1 体力', cost:1500,
              req:['chopped', 15, '砍伐 15 棵']},
  rockblast: {name:'🪨 岩崩', desc:'采石石头翻倍且少耗 1 体力', cost:1500,
              req:['mined', 15, '开采 15 块']},
  angler:    {name:'🎣 悠闲垂钓', desc:'鱼更快咬钩、更难逃脱', cost:2000,
              req:['fished', 10, '钓鱼 10 次']},
  vigor:     {name:'💤 卡比兽之力', desc:'体力上限 +25', cost:2500,
              req:['daysPlayed', 14, '游玩 14 天']},
  sunlight:  {name:'🌱 日光束', desc:'按 F：浇灌并催熟周围 5×5 作物（耗 20 体力）', cost:3000,
              req:['harvested', 40, '收获 40 个']},
};
const BAG_PRICES = [800, 2000, 4000]; // 背包扩容 9→12→15→18 格

/* ---------------- 野生宝可梦（混熟后学会变身成对方） ----------------
   每天随机出没；聊天 +5 / 喂食 +15（各一次/天）；好感 100 学会变身并获得被动 */
const WILD_POOL = {
  pidgey:    {name:'波波', perk:'顺风：移动速度 +25%',
              lines:['啾…？（警惕地打量着你）','啾啾！（歪着头靠近了一点）','啾♪（落在你身边蹦蹦跳跳）','啾——！（亲昵地蹭了蹭百变怪）']},
  magnemite: {name:'小磁怪', perk:'磁力：伐木 / 采石产出 +1',

/* ---------------- 工具函数 ---------------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x,y){ let h = x*374761393 + y*668265263; h = (h ^ (h>>>13)) * 1274126177; return ((h ^ (h>>>16)) >>> 0); }
function hexToRgb(hex){ const n = parseInt(hex.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shadeColor(hex, delta){ if (delta>128) delta-=256; // Uint8Array 回绕：-20..-1 存成了 236..255
  const [r,g,b] = hexToRgb(hex); const c = v => clamp(v+delta,0,255); return 'rgb('+c(r)+','+c(g)+','+c(b)+')'; }
const idx = (x,y) => y*MAP_W+x;
const idxI = (x,y) => y*INT_W+x;
const worldX = tx => tx - MAP_W/2;
const worldZ = ty => ty - MAP_H/2;

/* ---------------- 地图生成 ---------------- */
function genMap(){
  const R = mulberry32(20240615);
  const tile = new Uint8Array(MAP_W*MAP_H);
  const deco = new Uint8Array(MAP_W*MAP_H);
  const shade = new Uint8Array(MAP_W*MAP_H);
  for (let i=0;i<tile.length;i++) shade[i] = Math.floor(R()*41)-20;
  for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++){
    if (x<2||y<2||x>=MAP_W-2||y>=MAP_H-2) deco[idx(x,y)] = D_TREE;
  }
  for (let y=27;y<=33;y++) for (let x=40;x<=45;x++){
    const dx=(x-42.5)/3, dy=(y-30)/2.9;
    if (dx*dx+dy*dy <= 1) tile[idx(x,y)] = T_WATER;
  }
  for (let y=12;y<=24;y++) if (tile[idx(12,y)]===T_GRASS) tile[idx(12,y)] = T_PATH;
  for (let x=12;x<=34;x++) if (tile[idx(x,24)]===T_GRASS) tile[idx(x,24)] = T_PATH;
  for (let y=8;y<=11;y++) for (let x=16;x<=19;x++) tile[idx(x,y)] = T_TILLED;

  const okGrass = (x,y,minDist)=>{
    if (x<3||y<3||x>=MAP_W-3||y>=MAP_H-3) return false;
    const i = idx(x,y);
    if (tile[i]!==T_GRASS) return false;
    if (x>=HOUSE.x-1 && x<=HOUSE.x+HOUSE.w && y>=HOUSE.y-1 && y<=HOUSE.y+HOUSE.h) return false;
    if (x>=SHOP.x-1 && x<=SHOP.x+SHOP.w && y>=SHOP.y-1 && y<=SHOP.y+SHOP.h) return false;
    for (let dy=-minDist;dy<=minDist;dy++) for (let dx=-minDist;dx<=minDist;dx++){
      const nx=x+dx, ny=y+dy;
      if (nx<0||ny<0||nx>=MAP_W||ny>=MAP_H) continue;
      const ni=idx(nx,ny);
      if (deco[ni]===D_TREE||deco[ni]===D_ROCK||tile[ni]===T_WATER) return false;
    }
    return true;
  };
  let trees=0;
  for (let tries=0; tries<400 && trees<42; tries++){
    const x=3+Math.floor(R()*(MAP_W-6)), y=3+Math.floor(R()*(MAP_H-6));
    if (okGrass(x,y,1)){ deco[idx(x,y)]=D_TREE; trees++; }
  }
  let rocks=0;
  for (let tries=0; tries<300 && rocks<18; tries++){
    const x=3+Math.floor(R()*(MAP_W-6)), y=3+Math.floor(R()*(MAP_H-6));
    if (okGrass(x,y,1)){ deco[idx(x,y)]=D_ROCK; rocks++; }
  }
  let tall=0;
  for (let tries=0; tries<300 && tall<26; tries++){
    const x=2+Math.floor(R()*(MAP_W-4)), y=2+Math.floor(R()*(MAP_H-4));
    if (tile[idx(x,y)]===T_GRASS && deco[idx(x,y)]===D_NONE){ deco[idx(x,y)]=D_TALL; tall++; }
  }
  let fl=0;
  for (let tries=0; tries<200 && fl<12; tries++){
    const x=2+Math.floor(R()*(MAP_W-4)), y=2+Math.floor(R()*(MAP_H-4));
    if (tile[idx(x,y)]===T_GRASS && deco[idx(x,y)]===D_NONE){ deco[idx(x,y)]=D_FLOWER; fl++; }
  }
  return {tile, deco, shade};
}

function genInterior(){
  const tile = new Uint8Array(INT_W*INT_H);
  for (let y=0;y<INT_H;y++) for (let x=0;x<INT_W;x++){
    tile[idxI(x,y)] = (x===0||y===0||x===INT_W-1||y===INT_H-1) ? T_WALL : T_FLOOR;
  }
  return {tile, watered:new Uint8Array(INT_W*INT_H), crops:new Array(INT_W*INT_H).fill(null)};
}

function saveGame(){
  if (!game) return;
  try{
    const data = {
      v:3, season:game.season, day:game.day, weather:game.weather, time:game.time,
      gold:game.gold, energy:game.energy, inv:game.inv,
      tile:Array.from(game.tile), deco:Array.from(game.deco), shade:Array.from(game.shade),
      watered:Array.from(game.watered), crops:game.crops,
      stats:game.stats, npcs:game.npcs, npcLine:game.npcLine, toolLevel:game.toolLevel,
      skills:game.skills, bagLv:game.bagLv,
      guide:game.guide, guideDone:game.guideDone, achv:game.achv,
      wild:game.wild, wilds:game.wilds, wildForm:game.wildForm,
      player:{x:player.x,y:player.y,dir:player.dir}, inHouse, selected, soundOn,
    };

let saveFlashTimer = 0;

function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
/* ---------------- 存档码（跨浏览器 / 跨打开方式搬运进度） ----------------
   localStorage 按「源」隔离：file:// 打开和 http://localhost 打开是两个独立的存档空间，
   导出/导入存档码可以把进度在它们之间迁移。 */
function encodeSaveCode(raw){ try{ return btoa(unescape(encodeURIComponent(raw))); }catch(e){ return ''; } }
function decodeSaveCode(code){ try{ return decodeURIComponent(escape(atob(code.trim()))); }catch(e){ return null; } }
function exportSave(){
  if (!game) return;
  saveGame();
  let raw = '';
  try{ raw = localStorage.getItem(SAVE_KEY)||''; }catch(e){}
  const code = encodeSaveCode(raw);
  if (!code){ toast('导出失败'); return; }
  showDialog(
    '<h3>📤 导出存档</h3>'+
    '<div style="font-size:14px;margin-bottom:8px">复制这串存档代码，到其他浏览器 / 打开方式里用「📥 导入存档」即可恢复进度。</div>'+
    '<textarea id="save-code" readonly>'+code+'</textarea>',
    [{label:'📋 自动复制', gold:true, fn:()=>copySaveCode(code)},
     {label:'关闭', ghost:true, fn:closeDialog}]
  );
  const ta = $('save-code');
  if (ta) ta.addEventListener('focus', ()=>ta.select());
}
function copySaveCode(code){
  const done = ()=>toast('✅ 已复制到剪贴板');
  const fallback = ()=>{
    const ta = $('save-code');
    if (ta){ ta.focus(); ta.select(); toast('请按 Ctrl/Cmd+C 手动复制'); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done, fallback);
  } else fallback();
}
function importSave(){
  showDialog(
    '<h3>📥 导入存档</h3>'+
    '<div style="font-size:14px;margin-bottom:8px">粘贴之前导出的存档代码（会覆盖当前进度）。</div>'+
    '<textarea id="save-in" placeholder="在这里粘贴存档代码…"></textarea>',
    [{label:'导入', gold:true, fn:doImportSave},
     {label:'取消', ghost:true, fn:closeDialog}]
  );
}
function doImportSave(){
  const ta = $('save-in');
  const code = ta ? String(ta.value||'').trim() : '';
  if (!code){ toast('请先粘贴存档代码'); return; }
  const raw = decodeSaveCode(code);
  if (!raw || raw[0]!=='{'){ toast('存档代码无效'); sfx('error'); return; }
  let backup = '';
  try{ backup = localStorage.getItem(SAVE_KEY)||''; }catch(e){}
  try{ localStorage.setItem(SAVE_KEY, raw); }catch(e){}
  if (loadGame()){
    fishing = null;
    closeDialog();
    saveGame();
    sfx('coin');
    toast('📂 存档导入成功！');
  } else {
    try{ localStorage.setItem(SAVE_KEY, backup); }catch(e){}
    toast('存档解析失败，已保留原进度');
    sfx('error');
  }
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || (d.v!==1 && d.v!==2 && d.v!==3) || !Array.isArray(d.tile) || d.tile.length!==MAP_W*MAP_H) return false;

    // 兼容旧/损坏存档：缺失的数组给出安全默认值，避免读档即崩
    const len = MAP_W*MAP_H;
    const toBytes = (arr, fill) => {
      if (Array.isArray(arr) && arr.length === len) return Uint8Array.from(arr);
      const out = new Uint8Array(len);
      if (fill) out.fill(fill);
      return out;
    };
    const bagLv = clamp(parseInt(d.bagLv, 10)||0, 0, BAG_PRICES.length);
    const totalSlots = INV_SLOTS + 3*bagLv;
    const skills = Array.isArray(d.skills) ? d.skills.filter(id => SKILLS[id]) : [];
    const inv = Array.isArray(d.inv) ? d.inv.slice(0, totalSlots) : [];
    while (inv.length < totalSlots) inv.push({id:null, n:0});
    for (let i=0;i<totalSlots;i++){
      const s = inv[i];
      const id = s && ITEMS[s.id] ? s.id : null;
      const n = s ? Math.max(0, parseInt(s.n, 10)||0) : 0;
      inv[i] = (id && n>0) ? {id, n} : {id:null, n:0};
    }
    const stats = Object.assign({earned:0, harvested:0, chopped:0, mined:0, daysPlayed:0, watered:0, fished:0}, d.stats || {});
    const playerData = d.player || {};
    const toolLevel = {};
    for (const k of ['tool_hoe','tool_can','tool_axe','tool_pick','tool_rod'])
      toolLevel[k] = clamp(parseInt(d.toolLevel && d.toolLevel[k], 10)||0, 0, 2);
    const rawCrops = Array.isArray(d.crops) && d.crops.length === len ? d.crops : new Array(len).fill(null);
    const crops = rawCrops.map(c => {
      if (!c || !CROPS[c.type]) return null;
      return {type:c.type, rem: clamp(parseInt(c.rem, 10)||0, 0, CROPS[c.type].days)};
    });
    const npcs = (Array.isArray(d.npcs) ? d.npcs : []).filter(n => n && typeof n.id === 'string').map(n => ({
      ...n,
      x: Number.isFinite(Number(n.x)) ? Number(n.x) : 4.5,
      y: Number.isFinite(Number(n.y)) ? Number(n.y) : 4.5,
      target: Array.isArray(n.target) ? n.target : null,
      wait: Math.max(0, Number(n.wait)||0),
    }));

    game = {
      season: SEASON_ORDER.includes(d.season) ? d.season : 'spring',
      day: clamp(parseInt(d.day, 10)||1, 1, DAYS_PER_SEASON),
      weather: WEATHER_NAMES[d.weather] ? d.weather : 'sunny',
      time: clamp(Number(d.time)||0, 0, 26*60),
      gold: Math.max(0, Number(d.gold)||0),
      energy: Number.isFinite(Number(d.energy)) ? clamp(Number(d.energy), 0, MAX_ENERGY+25) : MAX_ENERGY,
      inv,
      tile:toBytes(d.tile), deco:toBytes(d.deco), shade:toBytes(d.shade),
      watered:toBytes(d.watered),
      crops,
      stats, npcs, npcLine: parseInt(d.npcLine, 10)||0,
      toolLevel, skills, bagLv,
      guide: typeof d.guide==='object' && d.guide
        ? Object.assign({till:0, plant:0, water:0, sleep:0, harvest:0, sell:0}, d.guide) 
        : {till:0, plant:0, water:0, sleep:0, harvest:0, sell:0},
      guideDone: !!d.guideDone,
      achv: typeof d.achv==='object' && d.achv ? d.achv : {},
      wild: typeof d.wild==='object' && d.wild ? d.wild : {},
      wilds: Array.isArray(d.wilds) ? d.wilds.filter(w=>w && WILD_POOL[w.id] && Number.isFinite(Number(w.x))) : [],
      wildForm: d.wildForm && WILD_POOL[d.wildForm] ? d.wildForm : null,
    };
    interior = genInterior();
    initWildFriendship();
    inHouse = !!d.inHouse;
    soundOn = typeof d.soundOn === 'boolean' ? d.soundOn : true;
    const maxX = inHouse ? INT_W-1 : MAP_W-1;
    const maxY = inHouse ? INT_H-1 : MAP_H-1;
    player.x = clamp(Number(playerData.x)||0, 0, maxX);
    player.y = clamp(Number(playerData.y)||0, 0, maxY);
    player.dir = clamp(parseInt(playerData.dir, 10)||0, 0, 3);
    player.moving = false; player.mx = player.x; player.my = player.y;
    selected = clamp(d.selected||0, 0, totalSlots-1);
    fishing = null;
    applyForm();
    updateHud(); renderHotbar();
    refreshWorld3D();
    rebuildNPCs3D();
    rebuildWilds3D();
    snapCamera();
    return true;
  }catch(e){ return false; }
}

/* ---------------- 地形判定 ---------------- */
function interiorSolid(tx,ty){
  if (tx<0||ty<0||tx>=INT_W||ty>=INT_H) return true;
  if (interior.tile[idxI(tx,ty)]===T_WALL) return true;
  for (const [bx,by] of BED_TILES) if (bx===tx&&by===ty) return true;
  for (const [bx,by] of TABLE_TILES) if (bx===tx&&by===ty) return true;
  return false;
}
function isSolid(tx,ty){
  if (inHouse) return interiorSolid(tx,ty);
  if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return true;
  const i = idx(tx,ty);
  if (game.tile[i]===T_WATER) return true;
  if (game.deco[i]===D_TREE||game.deco[i]===D_ROCK) return true;
  if (tx>=HOUSE.x&&tx<HOUSE.x+HOUSE.w&&ty>=HOUSE.y&&ty<HOUSE.y+HOUSE.h) return true;
  if (tx>=SHOP.x&&tx<SHOP.x+SHOP.w&&ty>=SHOP.y&&ty<SHOP.y+SHOP.h) return true;
  return false;
}

function pickTile(e){
  if (!renderer || !camera) return null;
  const rect = canvas.getBoundingClientRect();
  const ndc = { x: ((e.clientX-rect.left)/rect.width)*2-1, y: -((e.clientY-rect.top)/rect.height)*2+1 };
  raycaster.setFromCamera(ndc, camera);
  if (inHouse){
    if (!interiorGround) return null;
    const hit = raycaster.intersectObject(interiorGround, false)[0];
    if (!hit) return null;
    return [Math.floor(hit.point.x + INT_W/2), Math.floor(hit.point.z + INT_H/2)];
  }
  if (!groundMesh) return null;
  const hit = raycaster.intersectObject(groundMesh, false)[0];
  if (!hit) return null;
  if (hit.instanceId != null) return [hit.instanceId % MAP_W, Math.floor(hit.instanceId / MAP_W)];
  const u = hit.object.userData;
  return u ? [u.tx, u.ty] : null;
}

  const t = pickTile(e);
  if (!t){ tip.classList.add('hidden'); return; }
  const [tx,ty] = t;
  if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H){ tip.classList.add('hidden'); return; }
  let text = '';
  const wildH = wildAt(tx,ty);
  const c = cropAt(tx,ty);
  if (wildH){
    const st = game.wild[wildH.id];
    text = '🌿 野生'+WILD_POOL[wildH.id].name+' · 好感 '+st.fp+'/100 · 按 E 互动（聊天/喂食）';
  } else if (c){
    const def = CROPS[c.type];
    text = def.icon+' '+def.name+' · ' + (c.rem<=0 ? '✅ 可以收获' : '还需生长 '+c.rem+' 天') + (wateredAt(tx,ty) ? ' · 💧' : '');
  } else {
    const d = decoAt(tx,ty);
    if (d===D_TREE) text = '🌳 树木 · 螳螂镰可砍伐（得木材）';
    else if (d===D_STUMP) text = '🪵 树桩';
    else if (d===D_ROCK) text = '🪨 岩石 · 拳石镐可开采（得石头）';
    else if (tileAt(tx,ty)===T_WATER) text = '💧 池塘 · 面向水面用钓竿可以钓鱼';
    else if (tileAt(tx,ty)===T_TILLED) text = wateredAt(tx,ty) ? '🟫 耕地 · 💧已浇水' : '🟫 耕地 · 未浇水';
  }
  if (!text){ tip.classList.add('hidden'); return; }
  tip.textContent = text;
  tip.classList.remove('hidden');
  const r = wrapEl.getBoundingClientRect();
  const x = Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 6);
  tip.style.left = x + 'px';
  tip.style.top = (e.clientY - r.top - 10) + 'px';
});
canvas.addEventListener('mouseleave', hideTip);

/* ---------------- HUD ---------------- */
function fmtTime(t){
  let h = Math.floor(t/60), m = Math.floor(t%60);
  h = h%24;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function updateHud(){
  if (!game) return;
  $('hud-date').textContent = SEASON_ICONS[game.season]+' '+SEASON_NAMES[game.season]+' 第'+game.day+'天';
  $('hud-time').textContent = fmtTime(game.time);
  $('hud-weather').textContent = WEATHER_ICONS[game.weather]+' '+WEATHER_NAMES[game.weather];
  $('hud-gold').textContent = '₽ '+game.gold;
  const mE = maxEnergy();
  const pct = Math.round(game.energy/mE*100);
  $('energyfill').style.width = pct+'%';
  if (game.energy < 20) $('energybar').classList.add('low');
  else $('energybar').classList.remove('low');
  $('energytxt').textContent = '体力 '+Math.max(0,Math.round(game.energy))+'/'+mE;
  let hint = inHouse ? 'E 睡觉 / 出门 · 屋内不能使用工具' : 'WASD/方向键 移动 · 空格/左键 使用 · E/右键 互动 · 1-9/滚轮 选物品 · Esc 菜单';
  if (!inHouse && hasSkill('dash')) hint = hint.replace('移动 ·', '移动(Shift冲刺) ·');
  if (!inHouse && hasSkill('sunlight')) hint += ' · F 日光束';
  const wildLearned = game && game.wild && Object.values(game.wild).some(w=>w.learned);
  if (!inHouse && wildLearned) hint += ' · T 变身';
  $('hint').textContent = hint;
}
function updateFormHud(){
  $('formbar').textContent = '变身形态：' + (FORM_NAMES[player.form]||player.form);
}
function toast(msg){
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .4s'; setTimeout(()=>el.remove(), 420); }, 2300);
}

/* ---------------- 新手引导清单 ---------------- */
const GUIDE_STEPS = [
  {id:'till',    label:'开垦草地（选锄头点草地）'},
  {id:'plant',   label:'种下树果（选种子点耕地）'},
  {id:'water',   label:'浇水（选水壶点耕地）'},

  {id:'harvest', label:'收获成熟的树果'},

];
function initGuide(){
  // 老存档按统计回填已完成步骤
  const g = game.guide;
  if (game.stats.harvested>0){ ['till','plant','water','harvest'].forEach(k=>g[k]=1); }
  if (game.stats.earned>0){ g.sell = 1; }
  if (game.stats.daysPlayed>1){ g.sleep = 1; }

function markGuide(id){

const ACHV_DEFS = {
  first_till:   {icon:'⛏', name:'破土'},
  first_harvest:{icon:'🌸', name:'第一份收成'},
  first_sale:   {icon:'₽', name:'开张大吉'},
  first_fish:   {icon:'🎣', name:'垂钓新手'},

  four_seasons: {icon:'🍁', name:'四季农人（玩满一年）'},
};
function unlockAchv(id){
  if (!game || !ACHV_DEFS[id] || (game.achv && game.achv[id])) return;
  if (!game.achv) game.achv = {};
  game.achv[id] = 1;

function renderHotbar(){
  const bar = $('hotbar');
  bar.innerHTML = '';
  const n = slotCount();
  bar.classList.toggle('compact', n > INV_SLOTS); // 超过 9 格用紧凑布局
  for (let i=0;i<n;i++){
    const slot = game ? game.inv[i] : null;
    const btn = document.createElement('button');
    btn.className = 'slot'+(i===selected?' sel':'');
    const item = slot && slot.id ? ITEMS[slot.id] : null;
    const kb = '<span class="kb">'+((i+1)%10)+'</span>';
    if (item){
      btn.innerHTML = kb+'<span>'+item.icon+'</span>';
      if (item.form) btn.innerHTML += '<span class="nm">'+FORM_NAMES[item.form]+'</span>';
      if (slot.n>1) btn.innerHTML += '<span class="cnt">×'+slot.n+'</span>';
      btn.title = item.name;
    } else {
      btn.innerHTML = kb+'<span style="opacity:.35">·</span>';
    }
    btn.addEventListener('mousedown', e=>{ e.preventDefault(); selectSlot(i); });
    bar.appendChild(btn);
  }
}
function selectSlot(i){
  selected = clamp(i, 0, slotCount()-1);
  applyForm();
  renderHotbar();
}
function cycleSlot(d){
  if (!game) return;
  const n = slotCount();
  // 固定最多扫描全部格子，避免背包全空时死循环
  for (let step=0; step<n; step++){
    selected = (selected + d + n) % n;
    const slot = game.inv[selected];
    if (slot && slot.id) break;
  }
  applyForm();
  renderHotbar();
}

/* ---------------- 变身形态 ---------------- */
function formForItem(item){
  if (!item) return 'ditto';
  if (item.form) return item.form;
  if (item.kind==='seed') return 'bulbasaur';
  return 'ditto';
}
function applyForm(){
  const slot = game && game.inv[selected];
  const item = (slot && slot.id) ? ITEMS[slot.id] : null;
  let form = formForItem(item);
  // 手持无形态物品时，可以用 T 键切换已混熟学到的野生形态
  if (form==='ditto' && game && game.wildForm && learnedWild(game.wildForm)) form = game.wildForm;
  player.form = form;
  updateFormHud();
  if (typeof setPlayerForm3D === 'function') setPlayerForm3D(player.form);
}
function cycleWildForm(){
  if (!game) return;
  const pool = ['ditto'];
  for (const id in WILD_POOL) if (learnedWild(id) && !pool.includes(id)) pool.push(id);
  if (pool.length < 2){ toast('还没有混熟的野生宝可梦，多和它们聊天、喂食吧！'); return; }
  const cur = game.wildForm && pool.includes(game.wildForm) ? game.wildForm : 'ditto';
  game.wildForm = pool[(pool.indexOf(cur)+1) % pool.length];
  applyForm();
  toast('变身：'+(FORM_NAMES[game.wildForm]||'百变怪'));
}

/* ---------------- 对话框 ---------------- */
function showDialog(html, actions){
  dialog = {html, actions};
  $('dlg-text').innerHTML = html;
  const box = $('dlg-actions');
  box.innerHTML = '';
  for (const a of actions){
    const b = document.createElement('button');
    b.textContent = a.label;
    if (a.gold) b.className='gold';
    if (a.ghost) b.className='ghost';
    b.addEventListener('click', a.fn);
    box.appendChild(b);
  }
  $('dialog').classList.remove('hidden');
}
function closeDialog(){ dialog = null; $('dialog').classList.add('hidden'); }
let msgQueue = [], msgDone = null;
function showMsg(lines, onDone){ msgQueue = lines.slice(); msgDone = onDone||null; nextMsg(); }
function nextMsg(){
  if (!msgQueue.length){ closeDialog(); if (msgDone) msgDone(); return; }
  const text = msgQueue.shift();
  showDialog('<div style="font-size:17px;white-space:pre-wrap">'+text+'</div>', [{label:'继续 ▸', gold:true, fn:nextMsg}]);
}
function showConfirm(text, onYes){
  showDialog('<div style="font-size:17px;white-space:pre-wrap;text-align:center">'+text+'</div>', [
    {label:'确定', gold:true, fn:()=>{ closeDialog(); onYes(); }},
    {label:'取消', ghost:true, fn:closeDialog},
  ]);
}

/* ---------------- 商店（喵喵） ---------------- */
function openShop(){ if (!inHouse) refreshShop(); }
function refreshShop(){
  if (!game) return;
  let buyHtml = '', hasCropOffer = false;
  for (const id in CROPS){
    if (!CROPS[id].season.includes(game.season)) continue;
    hasCropOffer = true;

      '<button data-buy="'+id+'">买 1</button><button data-buy5="'+id+'">买 5</button></div>';
  }
  if (!hasCropOffer) buyHtml = '<div style="opacity:.7;padding:6px">🍂 这个季节没有可种植的树果种子</div>';
  buyHtml += '<div class="shop-row"><span class="nm">🥛 哞哞鲜乳(回体力)</span><span class="pr">100₽</span>'+
    '<button data-buy="__salad">买 1</button><button data-buy5="__salad">买 5</button></div>';
  if (!countItem('tool_rod'))
    buyHtml += '<div class="shop-row"><span class="nm">🎣 可达鸭钓竿</span><span class="pr">250₽</span>'+
      '<button data-buy="__rod">买 1</button></div>';

  let sellHtml = '';
  const sellable = {};
  for (const s of game.inv){ if (s.id){ const it = ITEMS[s.id]; if (it && it.sell && s.n>0) sellable[s.id] = (sellable[s.id]||0)+s.n; } }
  for (const id in sellable){
    const it = ITEMS[id];
    sellHtml += '<div class="shop-row"><span class="nm">'+it.icon+' '+it.name+'</span><span class="pr">×'+sellable[id]+' = '+ (it.sell*sellable[id])+'₽</span>'+
      '<button data-sell="'+id+'">出售</button></div>';
  }
  if (!sellHtml) sellHtml = '<div style="opacity:.7;padding:6px">背包里没有可出售的物品</div>';

  const upNames = {tool_hoe:'⛏ 地鼠锄', tool_can:'💧 车厘龟壶', tool_axe:'🗡 螳螂镰', tool_pick:'👊 拳石镐', tool_rod:'🎣 钓竿'};
  let upHtml = '';
  for (const tid in upNames){
    // 还没买钓竿时不能升级钓竿
    if (tid==='tool_rod' && !countItem('tool_rod')) continue;
    const lv = (game.toolLevel && game.toolLevel[tid]) || 0;
    if (lv>=2){
      upHtml += '<div class="shop-row"><span class="nm">'+upNames[tid]+'</span><span class="pr">Lv.MAX</span><button disabled>已满</button></div>';
    } else {
      const w = 15*(lv+1), s = 8*(lv+1), g = lv===0 ? 200 : 500;
      upHtml += '<div class="shop-row"><span class="nm">'+upNames[tid]+' Lv.'+lv+'→'+(lv+1)+'</span>'+
        '<span class="pr">🪵'+w+' 🪨'+s+' '+g+'₽</span><button data-up="'+tid+'">升级</button></div>';
    }
  }

  // 背包扩容
  let bagHtml = '';
  if ((game.bagLv||0) >= BAG_PRICES.length){
    bagHtml = '<div class="shop-row"><span class="nm">🎒 背包 '+game.inv.length+' 格</span><span class="pr">已最大</span><button disabled>—</button></div>';
  } else {
    const bp = BAG_PRICES[game.bagLv||0];
    bagHtml = '<div class="shop-row"><span class="nm">🎒 背包扩容 '+(game.inv.length)+'→'+(game.inv.length+3)+' 格</span>'+
      '<span class="pr">'+bp+'₽</span><button data-bag="1">购买</button></div>';
  }

  // 技能研习（随成长解锁）
  let skillHtml = '';
  for (const id in SKILLS){
    const s = SKILLS[id];
    const nmHtml = '<span class="nm">'+s.name+'<br><small style="font-weight:400;opacity:.72">'+s.desc+'</small></span>';
    if (hasSkill(id)){
      skillHtml += '<div class="shop-row"><span class="nm">'+s.name+'</span><span class="pr">✅ 已习得</span><button disabled>—</button></div>';
      continue;
    }
    if (s.req){
      const [k2, n2, label] = s.req;
      const cur = game.stats[k2]||0;
      if (cur < n2){
        skillHtml += '<div class="shop-row" style="opacity:.62">'+nmHtml+
          '<span class="pr">🔒 '+label+'<br>'+cur+'/'+n2+'</span><button disabled>未解锁</button></div>';

    b.addEventListener('click', e=>{ e.stopPropagation(); sellItem(b.dataset.sell); });
  });
  $('dlg-box').querySelectorAll('[data-up]').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); upgradeTool(b.dataset.up); });
  });
  $('dlg-box').querySelectorAll('[data-bag]').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); buyBagUpgrade(); });
  });
  $('dlg-box').querySelectorAll('[data-skill]').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); buySkill(b.dataset.skill); });
  });

function upgradeTool(toolId){
  const lv = (game.toolLevel[toolId]||0);
  if (lv>=2){ toast('已经是最高等级了'); return; }
  const needW = 15*(lv+1), needS = 8*(lv+1), needG = lv===0 ? 200 : 500;
  if (countItem('wood')<needW || countItem('stone')<needS){
    toast('材料不足（需木材×'+needW+'、石头×'+needS+'）'); sfx('error'); return;
  }
  if (game.gold<needG){ toast('₽ 不够啦！'); sfx('error'); return; }
  removeItem('wood', needW); removeItem('stone', needS); game.gold -= needG;
  game.toolLevel[toolId] = lv+1;
  sfx('coin');
  toast(ITEMS[toolId].name+' 升级到 Lv.'+(lv+1)+'！使用体力降低');
  updateHud(); renderHotbar(); refreshShop();
}

/* ---------------- 技能研习 & 背包扩容 ---------------- */
function buySkill(id){
  const s = SKILLS[id];
  if (!s || !game || hasSkill(id)) return;
  if (s.req){
    const [k2, n2] = s.req;
    if ((game.stats[k2]||0) < n2){ toast('还需要继续成长才能研习这个技能'); sfx('error'); return; }
  }
  if (game.gold < s.cost){ toast('₽ 不够啦！'); sfx('error'); return; }
  game.gold -= s.cost;
  game.skills.push(id);
  sfx('skill');
  toast('✨ 习得 '+s.name+'！');
  if (id==='vigor') toast('💤 体力上限提升到 '+maxEnergy()+'！');
  updateHud(); renderHotbar(); refreshShop();
}
function buyBagUpgrade(){
  if (!game) return;
  const lv = game.bagLv||0;
  if (lv >= BAG_PRICES.length){ toast('背包已是最大容量'); return; }
  const price = BAG_PRICES[lv];
  if (game.gold < price){ toast('₽ 不够啦！'); sfx('error'); return; }
  game.gold -= price;
  game.bagLv = lv+1;
  for (let i=0;i<3;i++) game.inv.push({id:null, n:0});
  sfx('coin');
  toast('🎒 背包扩容到 '+game.inv.length+' 格！');
  updateHud(); renderHotbar(); refreshShop();
}
function buyItem(seedId, qty){
  if (seedId==='__rod') qty = 1; // 钓竿是工具，只买单件
  const price = seedId==='__salad' ? ITEMS.salad.buy : seedId==='__rod' ? ITEMS.tool_rod.buy : CROPS[seedId].seed;
  const itemId = seedId==='__salad' ? 'salad' : seedId==='__rod' ? 'tool_rod' : 'seed_'+seedId;
  const cost = price*qty;
  if (game.gold < cost){ toast('₽ 不够啦！'); sfx('error'); return; }
  if (addItem(itemId, qty) === false){ toast('背包已满！'); sfx('error'); return; }
  game.gold -= cost;
  sfx('coin');
  toast('购买了 '+ITEMS[itemId].name+' ×'+qty);
  updateHud(); renderHotbar(); refreshShop();
}
function sellItem(itemId){
  const it = ITEMS[itemId];
  if (!it || !it.sell) return;
  let total = 0, sold = 0;
  for (const s of game.inv){
    if (s.id===itemId && s.n>0){ total += s.n*it.sell; sold += s.n; s.n = 0; s.id = null; }
  }
  if (!sold){ toast('没有可出售的物品'); return; }
  game.gold += total;
  game.stats.earned += total;
  sfx('coin');
  toast('出售 '+it.name+' ×'+sold+'，获得 '+total+'₽');
  const shopW = playerWorld();
  spawnFloater('+₽'+total, worldX(SHOP.x+1), worldZ(SHOP.y+1), '#ffd75e', 1.8);
  markGuide('sell'); unlockAchv('first_sale');
  if (game.stats.earned>=1000) unlockAchv('rich');
  updateHud(); renderHotbar(); refreshShop();
}

/* ---------------- 物品 ---------------- */
function addItem(id, n){
  for (const s of game.inv) if (s.id===id){ s.n += n; return true; }
  for (const s of game.inv) if (!s.id){ s.id=id; s.n=n; return true; }
  return false;
}
function countItem(id){
  let n = 0;
  for (const s of game.inv) if (s.id===id) n += s.n;
  return n;
}
function hasSkill(id){ return !!(game && game.skills && game.skills.includes(id)); }
function learnedWild(id){ return !!(game && game.wild && game.wild[id] && game.wild[id].learned); }
function maxEnergy(){ return MAX_ENERGY + (hasSkill('vigor') ? 25 : 0); }
function slotCount(){ return INV_SLOTS + 3*((game && game.bagLv) || 0); }
function initWildFriendship(){
  if (!game) return;
  if (!game.wild || typeof game.wild !== 'object') game.wild = {};
  for (const id in WILD_POOL){
    if (!game.wild[id] || typeof game.wild[id] !== 'object') game.wild[id] = {fp:0, learned:false};
    game.wild[id].fp = clamp(parseInt(game.wild[id].fp,10)||0, 0, 100);
    game.wild[id].learned = !!game.wild[id].learned;
  }
}
/* 每天随机刷新野生宝可梦（1~2 只），位置避开建筑/耕地/水面 */
function spawnWilds(){
  if (!game) return;
  game.wilds = [];
  const count = 1 + (Math.random()<0.5 ? 1 : 0);
  const ids = Object.keys(WILD_POOL);
  for (let n=0; n<count; n++){
    const id = ids[Math.floor(Math.random()*ids.length)];
    for (let tries=0; tries<60; tries++){
      const x = 3+Math.floor(Math.random()*(MAP_W-6));
      const y = 3+Math.floor(Math.random()*(MAP_H-6));
      const i = idx(x,y);
      if (isSolid(x,y)) continue;
      if (game.tile[i]!==T_GRASS) continue;
      if (game.crops[i]) continue;
      if (x>=HOUSE.x-2 && x<=HOUSE.x+HOUSE.w+1 && y>=HOUSE.y-2 && y<=HOUSE.y+HOUSE.h+2) continue;
      if (x>=SHOP.x-2 && x<=SHOP.x+SHOP.w+1 && y>=SHOP.y-2 && y<=SHOP.y+SHOP.h+2) continue;
      let near = false;
      for (const w of game.wilds) if (Math.abs(w.x-x-0.5)<4 && Math.abs(w.y-y-0.5)<4) near = true;
      for (const npc of game.npcs) if (Math.abs(npc.x-x-0.5)<2 && Math.abs(npc.y-y-0.5)<2) near = true;
      if (near) continue;
      game.wilds.push({id, x:x+0.5, y:y+0.5, target:null, wait:2+Math.random()*3, talked:false, fed:false});
      break;
    }
  }
}
function addWildFriendship(id, amount){
  const st = game.wild[id];
  if (!st) return false;
  if (st.learned) return false;
  st.fp = clamp(st.fp + amount, 0, 100);
  if (st.fp >= 100){
    st.learned = true;
    sfx('skill');
    toast('✨ 与'+WILD_POOL[id].name+'成为挚友！百变怪学会了变身成它！');
    unlockAchv('friend');
    toast('获得被动「'+WILD_POOL[id].perk.split('：')[0]+'」：'+WILD_POOL[id].perk.split('：')[1]);
  }
  return true;
}
function removeItem(id, n){
  for (const s of game.inv){
    if (s.id===id){
      const take = Math.min(s.n, n);
      s.n -= take; n -= take;
      if (s.n<=0){ s.id=null; s.n=0; }
      if (!n) break;
    }
  }
  return n===0;
}
function eatItem(id){
  const it = ITEMS[id];
  if (!it || !it.energy) return false;
  game.energy = Math.min(maxEnergy(), game.energy + it.energy);
  toast('吃了 '+it.name+'，体力 +'+it.energy);
  sfx('eat');
  return true;
}

/* ---------------- 行动 ---------------- */
function playerTile(){ return [Math.floor(player.x), Math.floor(player.y)]; }
function facingTile(){
  const [px,py] = playerTile();
  const d = DIRS[player.dir];
  return [px+d[0], py+d[1]];
}
function tileIndexIn(tx,ty){ return inHouse ? idxI(tx,ty) : idx(tx,ty); }
function tileAt(tx,ty){ return inHouse ? interior.tile[tileIndexIn(tx,ty)] : game.tile[tileIndexIn(tx,ty)]; }
function decoAt(tx,ty){ return inHouse ? D_NONE : game.deco[tileIndexIn(tx,ty)]; }
function cropAt(tx,ty){ return inHouse ? null : game.crops[tileIndexIn(tx,ty)]; }
function wateredAt(tx,ty){ return inHouse ? 0 : game.watered[tileIndexIn(tx,ty)]; }

function useSelected(){
  if (fishing){ handleFishingInput(); return; }
  const [tx,ty] = facingTile(); useOnTile(tx,ty);
}
function useOnTile(tx,ty){
  if (!game || forceSleeping) return;
  if (inHouse){ toast('屋内不能使用工具'); return; }
  if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return;
  const i = tileIndexIn(tx,ty);
  const sel = game.inv[selected];
  const item = sel && sel.id ? ITEMS[sel.id] : null;
  const c = cropAt(tx,ty);

  if (c && c.rem<=0 && (!item || item.kind!=='tool')){ harvest(tx,ty); return; }
  if (!item) return;
  const cost = (item.kind==='tool') ? toolCost(sel.id) : (item.kind==='seed' ? 1 : 0);

  switch (sel.id){
    case 'tool_hoe': {
      if (tileAt(tx,ty)!==T_GRASS){ toast('这里不能开垦'); return; }
      if (game.energy<cost){ toast('体力不足！'); sfx('error'); return; }
      game.tile[i]=T_TILLED; game.deco[i]=D_NONE; game.energy-=cost;
      triggerAction(); sfx('till'); updateTile3D(tx,ty); updateDeco3D(tx,ty);
      spawnBurst(worldX(tx+0.5), 0.3, worldZ(ty+0.5), 0x8a6a44, 8, 0.4, 1.8);
      markGuide('till'); unlockAchv('first_till');
      break;
    }
    case 'tool_can': {
      if (tileAt(tx,ty)!==T_TILLED){ toast('只能给开垦过的土地浇水'); return; }
      // 求雨圈：一次浇灌 3×3
      const waterTargets = [];
      if (hasSkill('rainring')){
        for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
          const x2=tx+dx, y2=ty+dy;
          if (x2<0||y2<0||x2>=MAP_W||y2>=MAP_H) continue;
          const i2 = idx(x2,y2);
          if (game.tile[i2]===T_TILLED && !game.watered[i2]) waterTargets.push([x2,y2]);
        }
      } else if (!wateredAt(tx,ty)) waterTargets.push([tx,ty]);
      if (!waterTargets.length) return;
      const canCost = Math.max(1, cost - (learnedWild('oddish')?1:0)); // 走路草「晨露」
      if (game.energy<canCost){ toast('体力不足！'); sfx('error'); return; }
      for (const [x2,y2] of waterTargets){
        game.watered[idx(x2,y2)] = 1;
        game.stats.watered++;
        updateTile3D(x2,y2);
        spawnBurst(worldX(x2+0.5), 0.35, worldZ(y2+0.5), 0x5ab8e8, 5, 0.3, 1.6);
      }
      game.energy -= canCost;
      triggerAction(); sfx('water');
      markGuide('water');
      if (waterTargets.length>1) toast('💧 求雨圈浇灌了 '+waterTargets.length+' 格');
      break;
    }
    case 'tool_axe': {
      if (decoAt(tx,ty)!==D_TREE){ toast('这里没有树'); return; }
      const axeCost = Math.max(1, cost - (hasSkill('cyclone')?1:0)); // 旋风刀省力
      if (game.energy<axeCost){ toast('体力不足！'); sfx('error'); return; }
      game.deco[i]=D_STUMP; game.energy-=axeCost; game.stats.chopped++;
      const woodYield = (hasSkill('cyclone') ? 6 : 3) + (learnedWild('magnemite')?1:0); // 旋风刀/磁力
      addItem('wood', woodYield); toast('获得 木材 ×'+woodYield);
      triggerAction(); sfx('chop'); updateDeco3D(tx,ty);
      spawnBurst(worldX(tx+0.5), 0.8, worldZ(ty+0.5), 0xb08a5a, 8, 0.5, 2.2);
      break;
    }
    case 'tool_pick': {
      if (decoAt(tx,ty)!==D_ROCK){ toast('这里没有石头'); return; }
      const pickCost = Math.max(1, cost - (hasSkill('rockblast')?1:0)); // 岩崩省力
      if (game.energy<pickCost){ toast('体力不足！'); sfx('error'); return; }
      game.deco[i]=D_NONE; game.energy-=pickCost; game.stats.mined++;
      const stoneYield = (hasSkill('rockblast') ? 4 : 2) + (learnedWild('magnemite')?1:0); // 岩崩/磁力
      addItem('stone', stoneYield); toast('获得 石头 ×'+stoneYield);
      triggerAction(); sfx('mine'); updateDeco3D(tx,ty);
      spawnBurst(worldX(tx+0.5), 0.4, worldZ(ty+0.5), 0x9aa0a8, 8, 0.4, 2.0);
      break;
    }
    case 'tool_rod': {
      if (tileAt(tx,ty)!==T_WATER){ toast('要面向水面才能钓鱼'); return; }
      if (game.energy<cost){ toast('体力不足！'); sfx('error'); return; }
      game.energy-=cost;
      const biteDelay = (1.2+Math.random()*2.6) * (hasSkill('angler')?0.55:1); // 悠闲垂钓：更快咬钩
      fishing = {phase:'wait', t:0, biteAt:biteDelay, tx, ty};
      triggerAction(); sfx('splash');
      toast('甩竿！咬钩后快速按 空格/E 收竿');
      break;
    }
    default: {
      if (item.kind==='seed'){
        if (c){ toast('这里已经种了东西'); return; }
        if (tileAt(tx,ty)!==T_TILLED){ toast('请先开垦土地'); return; }
        if (!CROPS[item.crop].season.includes(game.season)){ toast('这个季节无法种植！'); sfx('error'); return; }
        if (sel.n<=0){ toast('没有种子了'); return; }
        if (game.energy<cost){ toast('体力不足！'); sfx('error'); return; }
        game.crops[i] = {type:item.crop, rem:CROPS[item.crop].days};
        sel.n--; game.energy-=cost;
        if (sel.n<=0){ sel.id=null; sel.n=0; }
        triggerAction(); sfx('plant'); updateCrop3D(tx,ty);
        spawnBurst(worldX(tx+0.5), 0.3, worldZ(ty+0.5), 0x6cbf3f, 6, 0.3, 1.8);
        markGuide('plant');
      } else if (item.kind==='crop' || item.kind==='food'){
        const [px,py] = playerTile();
        if (tx===px && ty===py){
          if (eatItem(sel.id)){ sel.n--; if (sel.n<=0){ sel.id=null; sel.n=0; } }
        } else toast('树果要收获后才能使用');
      } else toast('这个物品不能使用');
    }
  }
  updateHud(); renderHotbar();
}
function toolCost(toolId){
  const base = toolId==='tool_hoe'?2 : toolId==='tool_can'?2 : toolId==='tool_axe'?4 : toolId==='tool_rod'?3 : 4;
  const lv = (game && game.toolLevel && game.toolLevel[toolId]) || 0;
  return Math.max(1, base - lv);
}
function harvest(tx,ty){
  const c = cropAt(tx,ty);
  if (!c || c.rem>0) return;
  if (addItem('crop_'+c.type, 1) === false){ toast('背包已满！'); sfx('error'); return; }
  game.crops[tileIndexIn(tx,ty)] = null;
  game.stats.harvested++;
  game.energy = Math.min(maxEnergy(), game.energy+1);
  sfx('harvest'); updateCrop3D(tx,ty);
  const def = CROPS[c.type];
  spawnBurst(worldX(tx+0.5), 0.6, worldZ(ty+0.5), def.berry, 10, 0.35, 2.6);
  spawnFloater('+1 '+def.icon+def.name, worldX(tx+0.5), worldZ(ty+0.5), '#ffe08a');
  markGuide('harvest'); unlockAchv('first_harvest');
  toast('收获 '+def.name+' ×1');
  updateHud(); renderHotbar();
}

/* ---------------- 钓鱼 ---------------- */
function handleFishingInput(){
  if (!fishing) return;
  if (fishing.phase==='bite') catchFish();
  else { fishing = null; toast('收回了钓竿'); }
}
function catchFish(){
  const r = Math.random();
  const type = r<0.60 ? 'magikarp' : r<0.95 ? 'goldeen' : 'gyarados';
  const id = 'fish_'+type;
  fishing = null;
  if (addItem(id,1)===false){ toast('背包满了，鱼又溜回水里…'); sfx('error'); return; }
  game.stats.fished = (game.stats.fished||0)+1;
  sfx(type==='gyarados' ? 'catch' : 'harvest');
  unlockAchv('first_fish');
  toast(type==='gyarados' ? '🌊💥 稀有！钓到了 暴鲤龙！！' : '钓到了 '+ITEMS[id].name+'！');
  updateHud(); renderHotbar();
}

/* ---------------- 日光束技能（F 键） ---------------- */
function useSunlight(){
  if (!game || forceSleeping) return;
  if (!hasSkill('sunlight')){ if (!menuOpen && !dialog) toast('还没有习得日光束（商店可研习）'); return; }
  if (inHouse){ toast('屋内不能使用技能'); return; }
  if (fishing){ toast('钓鱼中不能使用技能'); return; }
  const [px,py] = playerTile();
  let waterN = 0, growN = 0;
  for (let dy=-2;dy<=2;dy++) for (let dx=-2;dx<=2;dx++){
    const tx=px+dx, ty=py+dy;
    if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) continue;
    const i2 = idx(tx,ty);
    if (game.tile[i2]===T_TILLED && !game.watered[i2]){
      game.watered[i2]=1; waterN++; game.stats.watered++;
      updateTile3D(tx,ty);
    }
    const c = game.crops[i2];
    if (c && c.rem>0){ c.rem--; growN++; updateCrop3D(tx,ty); }
  }
  if (!waterN && !growN){ toast('周围没有可作用的耕地或作物'); return; }
  if (game.energy < 20){ toast('体力不足！（需要 20）'); sfx('error'); return; }
  game.energy -= 20;
  triggerAction(); sfx('plant'); sfx('water');
  spawnSunParticles();
  toast('🌱 日光束！浇灌 '+waterN+' 格 · 催熟 '+growN+' 株');
  updateHud();
}
function spawnSunParticles(){
  if (!GEO || !scene) return;
  const src = playerWorld();
  for (let i=0;i<14;i++){
    const m = new THREE.Mesh(GEO.sphere, mat(0xa8e858, {transparent:true, opacity:0.9, dynamic:true}));
    m.scale.setScalar(0.06+Math.random()*0.05);
    m.position.set(src.x+(Math.random()-0.5)*2.6, 0.3, src.z+(Math.random()-0.5)*2.6);
    scene.add(m);
    particles.push({mesh:m, vx:(Math.random()-0.5)*1.2, vy:2.5+Math.random()*2, vz:(Math.random()-0.5)*1.2, ttl:0.7, age:0});
  }
}

/* ---------------- 互动 ---------------- */
function interact(){
  if (fishing){ handleFishingInput(); return; }
  interactAt(...facingTile());
}
function interactAt(tx,ty){
  if (!game || forceSleeping) return;
  if (inHouse){
    for (const [bx,by] of BED_TILES) if (bx===tx&&by===ty){ showConfirm('要睡觉休息吗？（结束今天，进入下一天）', ()=>sleep(false)); return; }
    if (tx===INT_DOOR[0] && ty===INT_DOOR[1]){ exitHouse(); return; }
    toast('这里没什么特别的');
    return;
  }
  if (tx>=SHOP.x&&tx<SHOP.x+SHOP.w&&ty>=SHOP.y&&ty<SHOP.y+SHOP.h){ openShop(); return; }
  const npc = npcAt(tx,ty);
  if (npc){ talk(npc); return; }
  const wild = wildAt(tx,ty);
  if (wild){ talkWild(wild); return; }
  if (tx===HOUSE.doorX && ty===HOUSE.doorY){ enterHouse(); return; }
  const c = cropAt(tx,ty);
  if (c && c.rem<=0){ harvest(tx,ty); return; }
  // 野怪/常驻 NPC 不阻挡移动，玩家可能恰好站在它们格子上——脚下也能互动
  const [px,py] = playerTile();
  const wildHere = wildAt(px,py);
  if (wildHere){ talkWild(wildHere); return; }
  const npcHere = npcAt(px,py);
  if (npcHere){ talk(npcHere); return; }
  toast('这里没什么可互动的');
}
function npcAt(tx,ty){
  if (inHouse) return null;
  for (const n of game.npcs){
    if (Math.floor(n.x)===tx && Math.floor(n.y)===ty) return n;
  }
  return null;
}
function talk(npc){
  const line = game.npcLine%2===0 ? npc.line : npc.line2;
  game.npcLine++;
  showMsg(['【'+npc.name+'】', line]);
}

/* ---------------- 野生宝可梦互动（混熟 → 学变身） ---------------- */
function wildAt(tx,ty){
  if (inHouse || !game) return null;
  for (const w of game.wilds||[]){
    if (Math.floor(w.x)===tx && Math.floor(w.y)===ty) return w;
  }
  return null;
}
function talkWild(w){
  const info = WILD_POOL[w.id];
  const st = game.wild[w.id];
  const tier = st.learned ? 3 : st.fp>=70 ? 2 : st.fp>=30 ? 1 : 0;
  const tierName = ['陌生','熟悉','亲密','挚友'][tier];
  let bar = '';
  for (let i=0;i<10;i++) bar += (i < Math.floor(st.fp/10) ? '█' : '░');
  const sel = game.inv[selected];
  const selItem = sel && sel.id ? ITEMS[sel.id] : null;
  const canFeed = selItem && (selItem.kind==='crop' || selItem.kind==='food');

  let html = '<h3>🌿 野生 '+info.name+'</h3>'+
    '<div style="text-align:center;margin-bottom:8px">好感 '+st.fp+'/100 <span style="letter-spacing:1px;color:#b8860b">'+bar+'</span> · '+tierName+
    (st.learned ? ' · ✅ 已学会变身' : '')+'</div>'+
    '<div style="text-align:center;font-size:15px">「'+info.lines[tier]+'」</div>'+
    '<div style="text-align:center;font-size:13px;color:#8a5a10;margin-top:8px">混熟后百变怪可以变身成它，获得：'+info.perk+'</div>';
  const actions = [];
  if (!st.learned){
    actions.push({label: w.talked ? '今天聊过了' : '聊聊天 (+5)', fn: ()=>{
      w.talked = true;
      addWildFriendship(w.id, 5);
      talkWild(w);
    }});
    if (canFeed){
      actions.push({label: '喂食 '+selItem.icon+selItem.name+' (+15)', gold:true, fn: ()=>{
        sel.n--; if (sel.n<=0){ sel.id=null; sel.n=0; }
        w.fed = true;
        addWildFriendship(w.id, 15);
        renderHotbar();
        talkWild(w);
      }});
    } else {
      actions.push({label: '喂食（选中树果/鱼/食物）', ghost:true, fn:()=>{ toast('先在快捷栏选中树果或食物'); talkWild(w); }});
    }
  } else {
    actions.push({label: '一起玩', fn:()=>{ talkWild(w); }});
  }
  actions.push({label:'再见', ghost:true, fn:closeDialog});
  showDialog(html, actions);
}
function enterHouse(){
  inHouse = true;
  player.x = INT_DOOR[0]+0.5; player.y = INT_DOOR[1]-0.5;
  player.dir = 1; player.moving = false; player.mx=player.x; player.my=player.y;
  applyWorldVisibility(); updateHud(); updateFx(); snapCamera();
}
function exitHouse(){
  inHouse = false;
  player.x = HOUSE.doorX+0.5; player.y = HOUSE.doorY+1.5;
  player.dir = 0; player.moving = false; player.mx=player.x; player.my=player.y;
  applyWorldVisibility(); updateHud(); updateFx(); snapCamera();
}

/* ---------------- 睡觉 / 过天 ---------------- */
function sleep(passedOut){
  fishing = null;
  forceSleeping = true;
  const fadeEl = $('fade');
  if (fadeEl) fadeEl.classList.add('on'); // 黑屏遮住过天瞬间
  advanceDay(passedOut);
  forceSleeping = false;
  if (inHouse) exitHouse();
  if (fadeEl) setTimeout(()=>fadeEl.classList.remove('on'), 550); // 停顿一拍再"醒来"
  toast(passedOut ? '😵 体力耗尽，你晕倒了…' : '🌙 睡得真香！新的一天开始了');
  toast(SEASON_NAMES[game.season]+' 第'+game.day+'天 · '+WEATHER_ICONS[game.weather]+WEATHER_NAMES[game.weather]);
  updateHud();
}
function rollWeather(season){ if (season==='winter') return 'snow'; return Math.random()<0.75 ? 'sunny' : 'rain'; }
function advanceDay(passedOut){
  const rainToday = game.weather==='rain';
  for (let i=0;i<game.crops.length;i++){
    const c = game.crops[i];
    if (c && (game.watered[i] || rainToday)) c.rem = Math.max(0, c.rem-1);
  }
  game.day++;
  if (game.day > DAYS_PER_SEASON){
    game.day = 1;
    const si = SEASON_ORDER.indexOf(game.season);
      game.season = SEASON_ORDER[(si+1)%4];
      let withered = 0;
      for (let i=0;i<game.crops.length;i++){
        const c2 = game.crops[i];
        if (c2 && !CROPS[c2.type].season.includes(game.season)){ game.crops[i]=null; withered++; }
      }
      if (withered) toast('🍂 换季了，'+withered+' 株不合季节的树果枯萎了');
  }
  game.weather = rollWeather(game.season);
  game.watered.fill(0);
  if (game.weather==='rain'){ for (let i=0;i<game.tile.length;i++) if (game.tile[i]===T_TILLED) game.watered[i]=1; }
  regrow();
  spawnWilds();   // 野生宝可梦每天重新出没（好感度保留）
  game.energy = passedOut ? Math.floor(maxEnergy()*0.6) : maxEnergy();
  game.time = 6*60;
  game.stats.daysPlayed++;
  markGuide('sleep');
  if (game.stats.daysPlayed>=112) unlockAchv('four_seasons');
  saveGame();
  refreshWorld3D();
  rebuildWilds3D();
}
function regrow(){
  const R = Math.random;
  const trySpawn = (kind)=>{
    let x,y,i,guard=0;
    do {
      x = 3+Math.floor(R()*(MAP_W-6)); y = 3+Math.floor(R()*(MAP_H-6)); i = idx(x,y); guard++;
      if (guard>200) return;
    } while (game.tile[i]!==T_GRASS || game.deco[i]!==D_NONE ||
             (x>=HOUSE.x-1&&x<=HOUSE.x+HOUSE.w&&y>=HOUSE.y-1&&y<=HOUSE.y+HOUSE.h) ||
             (x>=SHOP.x-1&&x<=SHOP.x+SHOP.w&&y>=SHOP.y-1&&y<=SHOP.y+SHOP.h));
    game.deco[i] = kind;
    updateDeco3D(x,y);
  };
  for (let n=0;n<2;n++) if (R()<0.5) trySpawn(D_TREE);
  for (let n=0;n<1;n++) if (R()<0.5) trySpawn(D_ROCK);
}

/* ---------------- 菜单 ---------------- */
function openMenu(){ menuOpen = true; fishing = null; hideTip(); $('menu').classList.remove('hidden'); updateMenuSound(); }
function closeMenu(){ menuOpen = false; $('menu').classList.add('hidden'); $('menu-sub').innerHTML=''; }
function updateMenuSound(){ $('menu').querySelector('[data-act="sound"]').textContent = (soundOn?'🔊 声音：开':'🔇 声音：关'); }
function showSub(html){ $('menu-sub').innerHTML = html; }
$('menu').querySelectorAll('button').forEach(b=>{
  b.addEventListener('click', ()=>{
    const act = b.dataset.act;
    if (act==='continue') closeMenu();
    else if (act==='save'){ saveGame(); toast('💾 存档成功'); }
    else if (act==='load'){ closeMenu(); if (loadGame()) toast('📂 读取存档成功'); else toast('没有找到存档'); }

/* ---- 产品级音频：分层合成音效 + 环境音（鸟鸣/蟋蟀/雨声），纯 WebAudio 无素材 ---- */
const AudioFX = {
  ctx:null, master:null, noiseBuf:null, rainSrc:null, rainGain:null, ambTimer:null, lastStep:0,
  ensure(){
    if (this.ctx) { if (this.ctx.state==='suspended') this.ctx.resume(); return true; }
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      // 共享白噪声缓冲（1 秒），打击乐与雨声共用
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
      return true;
    }catch(e){ return false; }
  },
  tone(f, f2, dur, type, vol, delay){
    const c = this.ctx, t = c.currentTime + (delay||0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,f2||f), t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur, vol, filterType, filterF, filterF2, delay){
    const c = this.ctx, t = c.currentTime + (delay||0);
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = filterType||'lowpass';
    f.frequency.setValueAtTime(filterF||800, t);
    if (filterF2) f.frequency.exponentialRampToValueAtTime(filterF2, t+dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t+dur+0.05);
  },
  arp(freqs, step, dur, type, vol){
    freqs.forEach((f,i)=> this.tone(f, f, dur, type, vol, i*step));
  },
};
function sfx(kind){
  if (!soundOn) return;
  if (!AudioFX.ensure()) return;
  const A = AudioFX;
  try{
    switch(kind){
      case 'till': A.noise(.1,.14,'lowpass',420,140); A.tone(130,80,.09,'triangle',.06); break;
      case 'chop': A.noise(.06,.16,'bandpass',260); A.tone(180,120,.07,'square',.05); break;
      case 'mine': A.noise(.05,.12,'highpass',1800); A.tone(900,500,.06,'square',.05); break;
      case 'water': A.noise(.28,.09,'lowpass',1200,280); A.tone(500,200,.16,'sine',.05); break;
      case 'splash': A.noise(.32,.12,'lowpass',900,220); break;
      case 'plant': A.tone(440,660,.08,'sine',.09); break;
      case 'harvest': A.arp([660,880,1320],.06,.12,'sine',.09); break;
      case 'coin': A.tone(880,880,.06,'triangle',.09); A.tone(1320,1320,.12,'triangle',.07,.05); break;
      case 'eat': A.tone(400,300,.1,'sine',.08); A.noise(.06,.04,'lowpass',600); break;
      case 'error': A.tone(160,120,.18,'sawtooth',.07); break;
      case 'sleep': A.tone(320,180,.5,'sine',.08); break;
      case 'catch': A.arp([520,780,1170,1560],.05,.14,'sine',.09); break;
      case 'skill': A.arp([523,659,784,1046],.07,.18,'triangle',.08); break;
      case 'ui': A.tone(700,900,.045,'triangle',.045); break;
      case 'step': A.noise(.04,.028,'lowpass',300); break;
      default: A.tone(300,200,.1,'sine',.06);
    }
  }catch(e){}
}
/* 环境音调度：白天鸟鸣 / 夜晚蟋蟀 / 雨声循环，每 700ms 检查一次 */
function startAmbientAudio(){
  if (AudioFX.ambTimer) return;
  AudioFX.ambTimer = setInterval(()=>{
    if (!soundOn || !game || !AudioFX.ensure()) { if (AudioFX.rainGain) setRainAmbient(false); return; }
    const raining = game.weather==='rain' && !inHouse;
    setRainAmbient(raining);
    if (inHouse || raining) return; // 室内/雨声中不放鸟虫鸣
    const night = game.time>=1170 || game.time<330;
    const r = Math.random();
    if (night){
      if (r<0.55){ // 蟋蟀：高频短脉冲串
        const base = 3800+Math.random()*500;
        for (let i=0;i<3;i++) AudioFX.tone(base, base, .04, 'sine', .014, i*.09);
      }
    } else {
      if (r<0.4){ // 鸟鸣：2~4 个快速上行啁啾
        const f0 = 2200+Math.random()*900, n = 2+Math.floor(Math.random()*3);
        for (let i=0;i<n;i++) AudioFX.tone(f0*(1+i*0.12), f0*(1.25+i*0.12), .07, 'sine', .018, i*.1);
      }
    }
  }, 700);
}
function setRainAmbient(on){
  if (on && !AudioFX.rainSrc && AudioFX.ctx){
    const s = AudioFX.ctx.createBufferSource(); s.buffer = AudioFX.noiseBuf; s.loop = true;
    const f = AudioFX.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 900;
    const g = AudioFX.ctx.createGain(); g.gain.value = 0;
    s.connect(f); f.connect(g); g.connect(AudioFX.master);
    g.gain.linearRampToValueAtTime(0.05, AudioFX.ctx.currentTime+1.2); // 淡入
    s.start();
    AudioFX.rainSrc = s; AudioFX.rainGain = g;
  } else if (!on && AudioFX.rainSrc){
    try{
      const g = AudioFX.rainGain, s = AudioFX.rainSrc;
      g.gain.linearRampToValueAtTime(0, AudioFX.ctx.currentTime+0.8);
      setTimeout(()=>{ try{ s.stop(); }catch(e){} }, 900); // 淡出后停止
    }catch(e){}
    AudioFX.rainSrc = null; AudioFX.rainGain = null;
  }
}

  const m = (typeof location!=='undefined'?location.search:'').match(/[?&]zoom=([\d.]+)/);
  return m ? Math.min(1.5, Math.max(0.15, +m[1])) : null;
}catch(e){ return null; } })();

const matCache = new Map();
function mat(color, o){
  // 粒子等需要独立淡入淡出的材质不缓存；其余静态材质全部复用，避免反复创建/销毁
  if (o && o.dynamic) return makeMat(color, o);
  const key = color + '|' + (o && o.transparent ? 't' : 'o') + '|' + (o && o.opacity);
  let m = matCache.get(key);
  if (!m){ m = makeMat(color, o); matCache.set(key, m); }
  return m;
}
function makeMat(color, o){
  const m = new THREE.MeshLambertMaterial({color});
  if (o && o.transparent){ m.transparent = true; m.opacity = (o.opacity!=null?o.opacity:0.6); }
  return m;
}
function part(parent, geoName, color, x,y,z, opts){
  opts = opts||{};
  const m = new THREE.Mesh(GEO[geoName], mat(color, opts));
  m.position.set(x,y,z);
  if (opts.sx||opts.sy||opts.sz) m.scale.set(opts.sx||1, opts.sy||1, opts.sz||1);
  if (opts.rx) m.rotation.x = opts.rx;
  if (opts.ry) m.rotation.y = opts.ry;
  if (opts.rz) m.rotation.z = opts.rz;
  parent.add(m);
  return m;
}

/* ---- 地面瓦片（InstancedMesh 合并为 1 个 draw call） ---- */
function buildGround(){
  const count = MAP_W*MAP_H;
  groundMesh = new THREE.InstancedMesh(GEO.plane, mat(0xffffff), count);
  groundMesh.frustumCulled = false; // 实例遍布整张地图，避免包围盒误裁剪
  const dummy = new THREE.Object3D();
  dummy.rotation.x = -Math.PI/2;
  for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++){
    dummy.position.set(worldX(x+0.5), 0, worldZ(y+0.5));
    dummy.updateMatrix();
    groundMesh.setMatrixAt(idx(x,y), dummy.matrix);
  }
  groundMesh.instanceMatrix.needsUpdate = true;
  groundGroup.add(groundMesh);
}
function setTileColor(tx,ty,hex){
  if (!groundMesh) return;
  if (!groundColor) groundColor = new THREE.Color();
  groundColor.set(hex);
  groundMesh.setColorAt(idx(tx,ty), groundColor);
}
function commitGroundColors(){
  if (groundMesh && groundMesh.instanceColor) groundMesh.instanceColor.needsUpdate = true;
}
function groundTileBase(x,y){
  const i = idx(x,y), t = game.tile[i];
  if (t===T_WATER){
    // 与陆地相邻的格子用浅水色，形成岸线过渡
    const shore = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => {
      const nx=x+dx, ny=y+dy;
      return nx<0||ny<0||nx>=MAP_W||ny>=MAP_H || game.tile[idx(nx,ny)]!==T_WATER;
    });
    if (shore) return '#8fc3de';
    return ((x+y)%2===0) ? '#4e83c4' : '#4577b6';
  }
  if (t===T_TILLED) return game.watered[i] ? '#7a5a30' : '#96663a';
  if (t===T_PATH) return ((x+y)%2===0) ? '#c9a86a' : '#bf9d60';
  const base = ((x+y)%2===0) ? SEASON_COLORS[game.season] : SEASON_GRASS2[game.season];
  return (game.season==='winter' && ((x*3+y*5)%7===0)) ? '#e8eef4' : base;
}
function refreshGroundColors(){
  if (!game) return;
  for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++){
    setTileColor(x,y, shadeColor(groundTileBase(x,y), game.shade[idx(x,y)]));
  }
  commitGroundColors();
}
function updateTile3D(tx,ty){
  if (!game || !groundMesh) return;
  setTileColor(tx,ty, shadeColor(groundTileBase(tx,ty), game.shade[idx(tx,ty)]));
  commitGroundColors();
}

/* ---- 实体 ---- */
function buildEntities(){
  setPlayerForm3D(player.form);
  rebuildNPCs3D();
  rebuildWilds3D();
}
function rebuildNPCs3D(){
  if (!GEO || !entityGroup || !game) return;
  // 读档/新游戏时 game 对象会整体替换，必须同步重建 NPC 模型，避免引用旧状态
  for (const nm of npcMeshes) entityGroup.remove(nm.group);
  npcMeshes = [];
  for (const n of game.npcs){
    if (!n || !n.id) continue;
    const g = buildPokemon(n.id);
    g.position.set(worldX(n.x), 0, worldZ(n.y));
    entityGroup.add(g);
    npcMeshes.push({group:g, npc:n});
  }
}
let wildMeshes = [];
function rebuildWilds3D(){
  if (!GEO || !entityGroup || !game) return;
  for (const wm of wildMeshes) entityGroup.remove(wm.group);
  wildMeshes = [];
  for (const w of game.wilds||[]){
    if (!w || !WILD_POOL[w.id]) continue;
    const g = buildPokemon(w.id);
    g.position.set(worldX(w.x), 0, worldZ(w.y));
    entityGroup.add(g);
    wildMeshes.push({group:g, wild:w});
  }
}

/* =====================================================================
   宝可梦低多边形建模（形神兼具：剪影 + 配色 + 表情 + 待机动画）
   ===================================================================== */
function addFace(g, eyeColor, opts){
  opts = opts||{};
  const ey = opts.ey!=null?opts.ey:0.3, ez = opts.ez!=null?opts.ez:0.3, ex = opts.ex!=null?opts.ex:0.16;
  const s = opts.s||0.09;
  if (opts.white){ // 眼白在瞳孔后一圈，圆润卡通眼
    part(g,'sphere',0xffffff, -ex, ey, ez-s*0.3, {sx:s*1.2, sy:s*1.2, sz:s*0.6});
    part(g,'sphere',0xffffff, ex, ey, ez-s*0.3, {sx:s*1.2, sy:s*1.2, sz:s*0.6});
  }
  const left = part(g,'sphere',0x1a1a1a, -ex, ey, ez, {sx:s, sy:s, sz:s*0.65});
  const right = part(g,'sphere',0x1a1a1a, ex, ey, ez, {sx:s, sy:s, sz:s*0.65});
  // 高光点：让眼睛"有神"的关键
  part(g,'sphere',0xffffff, -ex-s*0.28, ey+s*0.3, ez+s*0.45, {sx:s*0.3, sy:s*0.3, sz:s*0.18});
  part(g,'sphere',0xffffff, ex-s*0.28, ey+s*0.3, ez+s*0.45, {sx:s*0.3, sy:s*0.3, sz:s*0.18});
  if (opts.cheek){
    part(g,'sphere',opts.cheek, -ex-s*0.85, ey-s*0.8, ez+0.06, {sx:s*0.75, sy:s*0.58, sz:s*0.4});
    part(g,'sphere',opts.cheek, ex+s*0.85, ey-s*0.8, ez+0.06, {sx:s*0.75, sy:s*0.58, sz:s*0.4});
  }
  if (opts.smile){ // 小张嘴（深色椭圆，比圆环嘴可爱）
    part(g,'sphere',0x5a3428, 0, opts.mouthY!=null?opts.mouthY:ey-s*1.6, ez+s*0.1, {sx:s*0.95, sy:s*0.5, sz:s*0.35});
  }
  if (opts.nose){
    part(g,'sphere',opts.nose, 0, opts.noseY!=null?opts.noseY:ey-s*0.7, ez+s*0.62, {sx:s*0.32, sy:s*0.24, sz:s*0.26});
  }
  return {left, right};
}
/* 耳朵：外耳锥 + 前侧内耳（深色），告别"光杆圆锥" */
function addEar(g, x, y, z, sx, sy, sz, outer, inner, rz){
  part(g,'cone',outer, x,y,z, {sx, sy, sz, rz: rz||0});
  if (inner) part(g,'cone',inner, x, y+sy*0.02, z+sz*0.32, {sx:sx*0.5, sy:sy*0.5, sz:sz*0.4, rz: rz||0});
}

  if (playerMesh) playerGroup.remove(playerMesh);
  playerMesh = buildPokemon(form||'ditto');
  playerMesh.userData.form = form;
  playerMesh.userData.id = form;
