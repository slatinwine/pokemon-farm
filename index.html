function drawHouse2D(){
  const x0 = Math.round((HOUSE.x-camLeftX())*S), y0 = Math.round((HOUSE.y-camTopY())*S);
  const W = HOUSE.w*S, H = HOUSE.h*S, roofH = Math.round(H*0.42);
  px2.fillStyle = '#e8d9b8'; px2.fillRect(x0, y0+roofH, W, H-roofH);       // 墙
  px2.fillStyle = '#d8c8a4';
  for (let vx=6; vx<W; vx+=22) px2.fillRect(x0+vx, y0+roofH, 2, H-roofH);  // 木梁
  for (let r=0;r<roofH;r+=2){                                              // 双坡屋顶
    const inset = Math.max(0, Math.round((roofH-r)*0.45));
    px2.fillStyle = (r>>1)%2 ? '#9a4430' : '#a04830';
    px2.fillRect(x0+inset-4, y0+r, W-inset*2+8, 2);
  }
  px2.fillStyle = '#6a3226'; px2.fillRect(x0-4, y0+roofH-2, W+8, 3);       // 檐口
  const dx = x0 + (HOUSE.doorX-HOUSE.x)*S + 4;
  px2.fillStyle = '#6a4a2c'; px2.fillRect(dx, y0+H-26, 18, 26);            // 门
  px2.fillStyle = '#7a5230'; px2.fillRect(dx+2, y0+H-24, 14, 24);
  px2.fillStyle = '#e8c020'; px2.fillRect(dx+12, y0+H-14, 3, 3);           // 门把
  for (const wx of [x0+12, x0+W-30]){                                      // 窗
    px2.fillStyle = '#fff6dc'; px2.fillRect(wx, y0+roofH+10, 20, 16);
    px2.fillStyle = '#6a4a2c'; px2.fillRect(wx+9, y0+roofH+10, 2, 16); px2.fillRect(wx, y0+roofH+17, 20, 2);
  }
  px2.fillStyle = '#8a5a48'; px2.fillRect(x0+W-26, y0+4, 12, 18);          // 烟囱
  px2.fillStyle = '#5a3a30'; px2.fillRect(x0+W-28, y0+2, 16, 4);
}
function drawShop2D(){
  const x0 = Math.round((SHOP.x-camLeftX())*S), y0 = Math.round((SHOP.y-camTopY())*S);
  const W = SHOP.w*S, H = SHOP.h*S;
  px2.fillStyle = '#7a5a34'; px2.fillRect(x0+6, y0+H-30, W-12, 30);        // 摊台
  px2.fillStyle = '#9c7a48'; px2.fillRect(x0+3, y0+H-34, W-6, 6);          // 台面
  for (let k=0;k<6;k++){                                                   // 红白棚
    px2.fillStyle = k%2 ? '#f2e8d8' : '#c0392b';
    px2.fillRect(x0-6+k*((W+12)/6), y0-14, (W+12)/6, 16);
  }
  px2.fillStyle = 'rgba(0,0,0,0.18)'; px2.fillRect(x0-6, y0+2, W+12, 3);
  px2.fillStyle = '#5a422a'; px2.fillRect(x0-4, y0-6, 4, H-8); px2.fillRect(x0+W, y0-6, 4, H-8); // 柱
  px2.fillStyle = '#8a6a20'; pxBlob(x0+W/2, y0-24, 9, 9);                  // 金币招牌
  px2.fillStyle = '#e8c020'; pxBlob(x0+W/2, y0-24, 7, 7);
  px2.fillStyle = '#c89818'; px2.fillRect(x0+W/2-1, y0-28, 2, 8);
}
/* ---- 实体（像素精灵） ---- */
function drawEntity2D(id, dirName, moving, wx, wy, t, big){
  const sx = Math.round((wx-camLeftX())*S), sy = Math.round((wy+0.5-camTopY())*S);
  // 脚底阴影
  px2.fillStyle = 'rgba(20,16,12,0.28)'; pxBlob(sx, sy-2, big?11:9, 3);
  const frame = moving ? Math.floor(t*7)%2 : 0;
  const breathe = (!moving && Math.floor(t*1.6)%2===1) ? 2 : 0; // 待机呼吸（整体起伏 1 美术像素）
  px2.drawImage(pxCanvas(id, dirName, frame), sx-16, sy-34-breathe, 32, 32);
}
/* ---- 主渲染 ---- */
function render2D(t){
  if (!px2 || !game) return;
  px2.fillStyle = '#101c14';
  px2.fillRect(0, 0, VIEW_W, VIEW_H);
  if (inHouse){ renderInterior2D(t); return; }
  const x0 = Math.max(0, Math.floor(camLeftX())), x1 = Math.min(MAP_W-1, Math.ceil(camLeftX()+VIEW_TW));
  const y0 = Math.max(0, Math.floor(camTopY())), y1 = Math.min(MAP_H-1, Math.ceil(camTopY()+VIEW_TH));
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) drawTile2D(x, y, game.tile[idx(x,y)]);
  // 贴地装饰（高草/花，绘制在角色之下）
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const d = game.deco[idx(x,y)];
    if (d===D_TALL) drawTallGrass2D(x,y);
    else if (d===D_FLOWER) drawFlower2D(x,y);
  }
  // 作物
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const c = game.crops[idx(x,y)];
    if (c) drawCrop2D(x, y, c);
  }
  // 需要 Y 排序的物体（树/石/建筑/精灵）
  const items = [];
  for (let y=y0;y<=Math.min(MAP_H-1,y1+2);y++) for (let x=x0;x<=x1;x++){
    const d = game.deco[idx(x,y)];
    if (d===D_TREE) items.push({y:y+1, f:()=>drawTree2D(x,y,false)});
    else if (d===D_STUMP) items.push({y:y+1, f:()=>drawTree2D(x,y,true)});
    else if (d===D_ROCK) items.push({y:y+1, f:()=>drawRock2D(x,y)});
  }
  items.push({y:HOUSE.y+HOUSE.h, f:drawHouse2D});
  items.push({y:SHOP.y+SHOP.h, f:drawShop2D});
  items.push({y:SHOP.y+1.9, f:()=>drawEntity2D('meowth','front',false,SHOP.x+1.8,SHOP.y+1.9,t)});
  for (const nm of npcMeshes){
    const n = nm.npc;
    let dir = nm.dir || 'front', moving = false;
    if (n.id==='snorlax') dir = 'front';
    else if (n.target){ moving = true; dir = facingToDir(Math.atan2(n.target[0]+0.5-n.x, n.target[1]+0.5-n.y)); nm.dir = dir; }
    items.push({y:n.y, f:()=>drawEntity2D(n.id, dir, moving, n.x, n.y, t, n.id==='snorlax')});
  }
  for (const wm of wildMeshes){
    const w = wm.wild;
    let dir = wm.dir || 'front', moving = false;
    if (w.target){ moving = true; dir = facingToDir(Math.atan2(w.target[0]+0.5-w.x, w.target[1]+0.5-w.y)); wm.dir = dir; }
    items.push({y:w.y, f:()=>drawEntity2D(w.id, dir, moving, w.x, w.y, t)});
  }
  items.push({y:player.y, f:()=>drawEntity2D(player.form||'ditto', ['back','front','left','right'][player.dir], player.moving, player.x, player.y, t)});
  items.sort((a,b)=>a.y-b.y);
  for (const it of items) it.f();
  // 目标格高亮
  if (!menuOpen && !dialog && !fishing){
    const [hx,hy] = facingTile();
    if (hx>=0 && hy>=0 && hx<MAP_W && hy<MAP_H){
      px2.strokeStyle = 'rgba(255,215,94,'+(0.55+0.25*Math.sin(t*4)).toFixed(2)+')';
      px2.lineWidth = 2;
      px2.strokeRect(Math.round((hx-camLeftX())*S)+1, Math.round((hy-camTopY())*S)+1, S-2, S-2);
    }
  }
  // 钓鱼浮漂 / 咬钩提示
  if (fishing){
    const bx = Math.round((fishing.tx+0.5-camLeftX())*S), by = Math.round((fishing.ty+0.5-camTopY())*S);
    px2.fillStyle = '#e04030'; px2.fillRect(bx-3, by-6, 6, 5);
    px2.fillStyle = '#f5f0e0'; px2.fillRect(bx-3, by-2, 6, 3);
    if (fishing.phase==='bite'){
      const bob = Math.abs(Math.sin(t*10))*4;
      px2.fillStyle = '#ffd75e';
      px2.fillRect(bx-2, by-30-bob, 4, 10); px2.fillRect(bx-2, by-18-bob, 4, 4);
    }
  }
  // 氛围粒子：白天花瓣 / 秋落叶 / 夜晚萤火虫
  if (!inHouse){
    const isNight = game.time>=1200 || game.time<330;
    if (isNight){
      px2.fillStyle = 'rgba(255,233,122,0.85)';
      for (let k=0;k<12;k++){
        const sd = hash2(k*13, 7)%1000/1000;
        const fx2 = camLeftX() + (hash2(k,3)%100)/100*VIEW_TW + Math.sin(t*0.6+sd*9)*1.6;
        const fy2 = camTopY() + (hash2(k,5)%100)/100*VIEW_TH + Math.sin(t*1.1+sd*7)*0.8;
        if (Math.floor(t*3+k)%3===0) continue;
        px2.fillRect(Math.round((fx2-camLeftX())*S), Math.round((fy2-camTopY())*S), 3, 3);
      }
    } else if (game.season==='spring' || game.season==='fall'){
      const col = game.season==='fall' ? 'rgba(208,132,56,0.9)' : 'rgba(242,174,198,0.9)';
      px2.fillStyle = col;
      for (let k=0;k<10;k++){
        const sd = (hash2(k*31, 11)%1000)/1000;
        const fall = ((t*0.06 + sd) % 1 + 1) % 1;
        const fx2 = camLeftX() + (hash2(k,3)%100)/100*VIEW_TW + Math.sin(t*0.9+sd*9)*1.2;
        const fy2 = camTopY() + fall*VIEW_TH;
        px2.fillRect(Math.round((fx2-camLeftX())*S), Math.round((fy2-camTopY())*S), 3, 3);
      }
    }
  }
  // 粒子
  for (const p of particles){
    px2.fillStyle = p.color;
    px2.globalAlpha = Math.max(0, 1-p.age/p.ttl);
    px2.fillRect(Math.round((p.x/16 - camLeftX())*S)-2, Math.round((p.y/16 - camTopY())*S)-2, 4, 4);
    px2.globalAlpha = 1;
  }
}

  px2.fillStyle = '#f2d488'; px2.fillRect(lx+4, ly+2, 24, 16);
  // 玩家（室内）
  drawEntity2D(player.form||'ditto', ['back','front','left','right'][player.dir], player.moving, player.x, player.y, t);
}
/* ---- 动作动画 + 粒子 ---- */
function triggerAction(){
  if (player.form==='squirtle') spawnWater();
  actionAnim = {form: player.form, t: 0};
}
function spawnWater(){
  if (!px2) return;
  const [tx,ty] = facingTile();
  const src = playerWorld();
  const X = (src.x+MAP_W/2)*16, Y = (src.z+MAP_H/2)*16;
  const dX = (tx+0.5+MAP_W/2-0.5)*16 - X, dY = (ty+0.5+MAP_H/2-0.5)*16 - Y;
  for (let i=0;i<10;i++){
    particles.push({x:X+(Math.random()-0.5)*6, y:Y-10, vx:dX/0.35, vy:-40-Math.random()*20, vz:0, ttl:0.5, age:0, color:'#5ab8e8'});
  }
}
function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.age += dt;
    if (p.age >= p.ttl){ particles.splice(i,1); continue; }
    p.vy += 140*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}
/* 彩色粒子爆发：收割/开垦/种植/敲击的落地反馈（x,z 为世界格坐标，hy 为抬升格数） */
function spawnBurst(x, y, z, color, n, spread, up){
  if (!px2) return;
  const X = (x+MAP_W/2)*16, Y = (z+MAP_H/2)*16 - (y||0.4)*16;
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = (0.8+Math.random()*1.4)*16;
    particles.push({x:X+(Math.random()-0.5)*(spread||0.3)*16, y:Y, vx:Math.cos(a)*sp, vy:-(up||2.4)*16, vz:0, ttl:0.55, age:0, color:cssColor(color)});
  }
}
/* 世界坐标 → 屏幕坐标，供 DOM 浮动文字定位（x,z 为世界格坐标） */
function worldToScreen(x, y, z){
  return { x:(x - camLeftX())*S, y:(z - camTopY())*S - (y!=null?y:1.2)*S };
}
function spawnFloater(text, wx, wz, color, hy){
  const wrap = $('floaters');
  if (!wrap) return;
  const p = worldToScreen(wx, hy!=null?hy:1.2, wz);
  if (!p) return;
  const el = document.createElement('span');
  el.className = 'floater';
  el.textContent = text;
  if (color) el.style.color = color;
  el.style.left = p.x+'px';
  el.style.top = p.y+'px';
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 1300);
}

/* ---- 氛围粒子：春季花瓣 / 秋季落叶 / 夜晚萤火虫 ---- */
function rebuildAmbient(kind){
  if (!ambientGroup) return;
  for (const p of ambientParts){
    ambientGroup.remove(p.mesh);
    if (p.mesh.material && p.mesh.material.dispose) p.mesh.material.dispose(); // 氛围材质为独立实例，需手动释放
  }
  ambientParts = [];
  ambientKind = kind;
  if (kind==='none') return;
  for (let i=0;i<16;i++){
    let m;
    if (kind==='firefly'){
      m = new THREE.Mesh(GEO.sphere, new THREE.MeshBasicMaterial({color:0xffe97a, transparent:true, opacity:0.9}));
    } else {
      m = new THREE.Mesh(GEO.plane, mat(kind==='leaf' ? 0xd08438 : 0xf2aec6, {transparent:true, opacity:0.85, dynamic:true}));
      m.scale.set(0.16, 0.16, 1);
    }
    ambientGroup.add(m);
    ambientParts.push({mesh:m, bx:(Math.random()*2-1)*11, bz:(Math.random()*2-1)*8, seed:Math.random()*10, spd:0.05+Math.random()*0.06});
  }
}
function updateAmbient(t){
  if (!ambientGroup || !game) return;
  if (inHouse){ ambientGroup.visible = false; return; }
  const isNight = game.time>=1200 || game.time<330;
  const kind = isNight ? 'firefly' : (game.season==='fall' ? 'leaf' : game.season==='spring' ? 'petal' : 'none');
  if (kind!==ambientKind) rebuildAmbient(kind);
  ambientGroup.visible = kind!=='none';
  if (kind==='none') return;
  for (const p of ambientParts){
    if (kind==='firefly'){
      p.mesh.position.set(
        camTarget.x + p.bx + Math.sin(t*0.6+p.seed)*2.0,
        0.55 + Math.sin(t*1.3+p.seed*2)*0.4,
        camTarget.z + p.bz + Math.cos(t*0.5+p.seed)*2.0);
      p.mesh.scale.setScalar(0.05+0.045*Math.max(0, Math.sin(t*3.5+p.seed*3)));
    } else {
      const f = ((t*p.spd + p.seed) % 1 + 1) % 1;
      p.mesh.position.set(
        camTarget.x + p.bx + Math.sin(t*1.1+p.seed)*1.8,
        4.6 - 4.4*f,
        camTarget.z + p.bz);
      p.mesh.rotation.set(t*0.8+p.seed, t*0.6+p.seed, 0);
    }
  }
}

/* ---- 树 / 石头 / 树果的 3D 构建 ---- */
const TREE_LEAVES = {
  spring: [0x4e9a3f, 0x5fae4a, 0x71bd57],
  summer: [0x3d8a33, 0x4e9e3f, 0x5fae49],
  fall:   [0xc0782c, 0xd29a3c, 0xb05c2a],
};
function buildTree3D(tx,ty,stump){
  const g = new THREE.Group();
  const px = worldX(tx+0.5), pz = worldZ(ty+0.5);
  const trunk = part(g,'cyl',0x6b4a2b, 0, 0.4, 0, {sx:0.3, sy:0.8, sz:0.3});
  if (stump){
    trunk.scale.set(0.3, 0.3, 0.3);
    trunk.position.y = 0.12;
    part(g,'cyl',0x8a6236, 0, 0.24, 0, {sx:0.4, sy:0.06, sz:0.4});
  } else if (game.season==='winter'){
    part(g,'sphere',0xdfe8ef, 0, 0.7, 0, {sx:0.5, sy:0.14, sz:0.5});
    part(g,'sphere',0xdfe8ef, 0, 1.0, 0, {sx:0.35, sy:0.12, sz:0.35});
  } else {
    // 用坐标 hash 让每棵树的大小/形态稳定地略有差异
    const h = hash2(tx,ty);
    const leaves = TREE_LEAVES[game.season] || TREE_LEAVES.spring;
    const s = 0.52 + (h%5)*0.05;
    const a = ((h>>>3)%100)/100*Math.PI*2;
    part(g,'sphere',leaves[0], 0, 0.92, 0, {sx:s, sy:s*0.9, sz:s});
    part(g,'sphere',leaves[1], Math.cos(a)*0.2, 1.1+((h>>>5)%3)*0.04, Math.sin(a)*0.2, {sx:s*0.72, sy:s*0.7, sz:s*0.72});
    part(g,'sphere',leaves[2], Math.cos(a+2.4)*0.22, 1.0, Math.sin(a+2.4)*0.22, {sx:s*0.6, sy:s*0.58, sz:s*0.6});
  }
  g.position.set(px, 0, pz);
  return g;
}
function buildRock3D(tx,ty){
  const g = new THREE.Group();
  const rock = part(g,'ico',0x7d8188, 0, 0.32, 0, {sx:0.5, sy:0.4, sz:0.5});
  part(g,'ico',0x94989f, -0.2, 0.5, 0.1, {sx:0.22, sy:0.18, sz:0.22});
  g.position.set(worldX(tx+0.5), 0, worldZ(ty+0.5));
  return g;
}
function buildTallGrass3D(tx,ty){
  const g = new THREE.Group();
  const h = hash2(tx,ty);
  for (let k=0;k<3;k++){
    const a = ((h>>>(k*3))%100)/100*Math.PI*2;
    const r = 0.12+((h>>>(k*5))%10)/100;
    part(g,'cone', k===0?0x5a9a48:0x6aae54, Math.cos(a)*r, 0.16+((h>>>k)%3)*0.04, Math.sin(a)*r,
      {sx:0.1, sy:0.3+k*0.05, sz:0.1});
  }
  g.position.set(worldX(tx+0.5), 0, worldZ(ty+0.5));
  return g;
}
const FLOWER_COLORS = [0xe86a8a, 0xf2c84a, 0xffffff, 0xc87ae8];
function buildFlower3D(tx,ty){
  const g = new THREE.Group();
  const h = hash2(tx,ty);
  const c = FLOWER_COLORS[h%FLOWER_COLORS.length];
  for (let k=0;k<2;k++){
    const ox = ((h>>>(k*4))%20)/10-1, oz = ((h>>>(k*7))%20)/10-1;
    part(g,'cyl',0x4e8a3c, ox*0.22, 0.12, oz*0.22, {sx:0.04, sy:0.24, sz:0.04});
    part(g,'sphere',c, ox*0.22, 0.28, oz*0.22, {sx:0.09, sy:0.07, sz:0.09});
    part(g,'sphere',0xf2d050, ox*0.22, 0.3, oz*0.22, {sx:0.04, sy:0.04, sz:0.04});
  }
  g.position.set(worldX(tx+0.5), 0, worldZ(ty+0.5));
  return g;
}
function buildCrop3D(tx,ty,crop){
  const g = new THREE.Group();
  const c = CROPS[crop.type];
  const prog = crop.rem<=0 ? 1 : 1 - crop.rem/c.days;
  const stage = crop.rem<=0 ? 3 : (prog<0.3?0 : prog<0.6?1 : 2);
  if (stage===0){
    part(g,'cyl',0x4a9a2f, 0, 0.08, 0, {sx:0.08, sy:0.16, sz:0.08});
    part(g,'cone',0x6cbf3f, -0.08, 0.2, 0, {sx:0.12, sy:0.12, sz:0.12});
    part(g,'cone',0x6cbf3f, 0.08, 0.2, 0, {sx:0.12, sy:0.12, sz:0.12});
  } else if (stage===1){
    part(g,'sphere',0x4a9a2f, 0, 0.18, 0, {sx:0.3, sy:0.24, sz:0.3});
    part(g,'sphere',0x5fae36, 0, 0.28, 0, {sx:0.18, sy:0.16, sz:0.18});
  } else if (stage===2){
    part(g,'sphere',0x3f8a26, 0, 0.28, 0, {sx:0.42, sy:0.34, sz:0.42});
    part(g,'sphere',0x5fae36, 0, 0.4, 0, {sx:0.24, sy:0.2, sz:0.24});
  } else {
    part(g,'sphere',0x3f8a26, 0, 0.28, 0, {sx:0.46, sy:0.36, sz:0.46});
    part(g,'sphere',0x5fae36, 0, 0.42, 0, {sx:0.28, sy:0.22, sz:0.28});
    const berry = part(g,'sphere',c.berry, 0, 0.58, 0, {sx:0.2, sy:0.2, sz:0.2});
    part(g,'sphere',c.berry, -0.16, 0.5, 0.08, {sx:0.15, sy:0.15, sz:0.15});
    part(g,'sphere',c.berry, 0.16, 0.5, -0.06, {sx:0.15, sy:0.15, sz:0.15});
    g.userData.berry = berry;
  }
  g.position.set(worldX(tx+0.5), 0, worldZ(ty+0.5));
  return g;
}

/* ---- 世界 3D 刷新 ---- */
function applyWorldVisibility(){
  if (farmGroup) farmGroup.visible = !inHouse;
  if (interiorGroup) interiorGroup.visible = inHouse;
}
function refreshWorld3D(){
  if (!GEO || !farmGroup) return;
  refreshGroundColors();
  rebuildDeco3D();
  rebuildCrop3D();
  applyWorldVisibility();
  updateFx();
}
function rebuildDeco3D(){
  for (const m of treeMeshes.values()) decoGroup.remove(m);
  for (const m of rockMeshes.values()) decoGroup.remove(m);
  for (const m of plantMeshes.values()) decoGroup.remove(m);
  treeMeshes.clear(); rockMeshes.clear(); plantMeshes.clear();
  for (let y=0;y<MAP_H;y++) for (let x=0;x<MAP_W;x++){
    const i = idx(x,y), d = game.deco[i];
    if (d===D_TREE){ const m = buildTree3D(x,y,false); decoGroup.add(m); treeMeshes.set(i,m); }
    else if (d===D_STUMP){ const m = buildTree3D(x,y,true); decoGroup.add(m); treeMeshes.set(i,m); }
    else if (d===D_ROCK){ const m = buildRock3D(x,y); decoGroup.add(m); rockMeshes.set(i,m); }
    else if (d===D_TALL){ const m = buildTallGrass3D(x,y); decoGroup.add(m); plantMeshes.set(i,m); }
    else if (d===D_FLOWER){ const m = buildFlower3D(x,y); decoGroup.add(m); plantMeshes.set(i,m); }
  }
}
function updateDeco3D(tx,ty){
  if (!GEO) return;
  const i = idx(tx,ty), d = game.deco[i];
  if (treeMeshes.has(i)){ decoGroup.remove(treeMeshes.get(i)); treeMeshes.delete(i); }
  if (rockMeshes.has(i)){ decoGroup.remove(rockMeshes.get(i)); rockMeshes.delete(i); }
  if (plantMeshes.has(i)){ decoGroup.remove(plantMeshes.get(i)); plantMeshes.delete(i); }
  if (d===D_TREE||d===D_STUMP){ const m = buildTree3D(tx,ty,d===D_STUMP); decoGroup.add(m); treeMeshes.set(i,m); }
  else if (d===D_ROCK){ const m = buildRock3D(tx,ty); decoGroup.add(m); rockMeshes.set(i,m); }
  else if (d===D_TALL){ const m = buildTallGrass3D(tx,ty); decoGroup.add(m); plantMeshes.set(i,m); }
  else if (d===D_FLOWER){ const m = buildFlower3D(tx,ty); decoGroup.add(m); plantMeshes.set(i,m); }
}
function rebuildCrop3D(){
  for (const m of cropMeshes.values()) cropGroup.remove(m);
  cropMeshes.clear();
  for (let i=0;i<game.crops.length;i++){
    const c = game.crops[i];
    if (!c) continue;
    const x = i%MAP_W, y = Math.floor(i/MAP_W);
    const m = buildCrop3D(x,y,c);
    cropGroup.add(m);
    cropMeshes.set(i,m);
  }
}
function updateCrop3D(tx,ty){
  if (!GEO) return;
  const i = idx(tx,ty);
  if (cropMeshes.has(i)){ cropGroup.remove(cropMeshes.get(i)); cropMeshes.delete(i); }
  const c = game.crops[i];
  if (c){ const m = buildCrop3D(tx,ty,c); cropGroup.add(m); cropMeshes.set(i,m); }
}

/* ---- 昼夜/天气覆盖 ---- */
function updateFx(){
  const t = game ? game.time : 6*60;
  let bg = 'rgba(0,0,0,0)';
  if (t < 430){ const k=(430-t)/70; bg = 'rgba(255,150,70,'+(0.2*k).toFixed(3)+')'; }
  else if (t >= 1080){
    if (t < 1200){ const k=(t-1080)/120; bg = 'rgba(255,130,50,'+(0.1+0.18*k).toFixed(3)+')'; }
    else if (t < 1440){ const k=(t-1200)/240; bg = 'rgba(30,25,80,'+(0.18+0.2*k).toFixed(3)+')'; }
    else { const k=(t-1440)/120; bg = 'rgba(20,18,60,'+Math.min(0.5,0.38+0.12*k).toFixed(3)+')'; }
  }
  $('fx').style.background = bg;
  $('rain').style.display = (game && game.weather==='rain') ? 'block':'none';
  $('snow').style.display = (game && game.weather==='snow') ? 'block':'none';
  // 天空颜色随季节 + 昼夜（白天/黄昏/夜晚）；室内用暗色背景增强封闭感
  if (renderer && game){
    const c = new THREE.Color(0x2b2115);
    if (!inHouse){
      const daySky = {spring:0x8fd0f0, summer:0x7ec8f0, fall:0xe8c090, winter:0xcfe0ea}[game.season] || 0x7ec8f0;
      c.set(daySky);
      const t = game.time;
      if (t >= 1050 && t < 1170) c.lerp(new THREE.Color(0xe0956a), (t-1050)/120);       // 黄昏
      else if (t >= 1170 || t < 270) c.set(0x17203a);                                   // 夜晚
      else if (t >= 270 && t < 390) c.lerp(new THREE.Color(0xe0956a), 1-(t-270)/120);   // 黎明
    }
    renderer.setClearColor(c.getHex());
    if (scene.fog) scene.fog.color.copy(c);
  }
}

/* ---- 相机跟随 ---- */
function setZoom(scale){
  if (!camera) return;
  const h = CAM_H * scale;
  camera.top = h; camera.bottom = -h;
  camera.left = -h*ASPECT; camera.right = h*ASPECT;
  camera.updateProjectionMatrix();
}
function applyCamera(){
  if (!camera) return; // 2D 像素模式下无 3D 相机，camTarget 由 updateCamera2D 驱动
  camera.position.set(camTarget.x, CAM_OFF.y, camTarget.z + CAM_OFF.z);
  camera.lookAt(camTarget.x, 0, camTarget.z);
}
function snapCamera(){
  // camTarget 对位对 2D/3D 都生效；setZoom/applyCamera 仅 3D 模式需要
  if (inHouse){ camTarget.x = 0; camTarget.z = 0; }
  else {
    camTarget.x = clamp(playerWorld().x, -CLAMP_X, CLAMP_X);
    camTarget.z = clamp(playerWorld().z, -CLAMP_Z, CLAMP_Z);
  }
  if (!camera) return; // 2D 像素模式：无 3D 相机可驱动
  setZoom(inHouse ? 0.55 : 1);
  applyCamera();
}
function updateCamera(dt){
  if (!camera) return;
  if (inHouse){
    camTarget.x = 0; camTarget.z = 0;
  } else {
    const pw = playerWorld();
    let tx = camTarget.x, tz = camTarget.z;
    const dx = pw.x - camTarget.x, dz = pw.z - camTarget.z;
    if (Math.abs(dx) > DEAD_X) tx = pw.x - Math.sign(dx)*DEAD_X;
    if (Math.abs(dz) > DEAD_Z) tz = pw.z - Math.sign(dz)*DEAD_Z;
    const k = Math.min(1, dt*8);
    camTarget.x += (tx - camTarget.x)*k;
    camTarget.z += (tz - camTarget.z)*k;
    camTarget.x = clamp(camTarget.x, -CLAMP_X, CLAMP_X);
    camTarget.z = clamp(camTarget.z, -CLAMP_Z, CLAMP_Z);
  }
  applyCamera();
}

/* ---- 更新 3D ---- */
function update3D(dt, t){
  if (!renderer || !game) return;
  updateCamera(dt);
  // 玩家位置（像素精灵：朝向决定贴图，走路双帧）
  const pw = playerWorld();
  playerMesh.position.set(pw.x, 0, pw.z);
  setSpriteFacing(playerMesh, ['back','front','left','right'][player.dir]);
  playerMesh.userData.moving = player.moving;
  animateModel(playerMesh, t);
  // 变身过渡缩放
  const scale = 1 + Math.sin(Math.min(1,(actionAnim?actionAnim.t:1)/0.3)*Math.PI)*0.08;
  playerMesh.scale.set(scale, 1 + (scale-1)*0.4, scale);
  if (actionAnim){
    actionAnim.t += dt;
    if (actionAnim.t > 0.5) actionAnim = null;
  }
  // NPC（像素精灵：移动方向决定朝向贴图）
  for (const nm of npcMeshes){
    const n = nm.npc;
    const px0 = nm.group.position.x, pz0 = nm.group.position.z;
    nm.group.position.set(worldX(n.x), 0, worldZ(n.y));
    const mdx = nm.group.position.x - px0, mdz = nm.group.position.z - pz0;
    const moving = mdx*mdx + mdz*mdz > 1e-8;
    if (moving) nm.face = Math.atan2(mdx, mdz);
    nm.group.userData.moving = moving;
    setSpriteFacing(nm.group, n.id==='snorlax' ? 'front' : (nm.face!=null ? facingToDir(nm.face) : 'front'));
    animateModel(nm.group, t + (n.id.length));
  }
  // 野生宝可梦
  for (const wm of wildMeshes){
    const w = wm.wild;
    const px0 = wm.group.position.x, pz0 = wm.group.position.z;
    wm.group.position.set(worldX(w.x), 0, worldZ(w.y));
    const mdx = wm.group.position.x - px0, mdz = wm.group.position.z - pz0;
    const moving = mdx*mdx + mdz*mdz > 1e-8;
    if (moving) wm.face = Math.atan2(mdx, mdz);
    wm.group.userData.moving = moving;
    setSpriteFacing(wm.group, wm.face!=null ? facingToDir(wm.face) : 'front');
    animateModel(wm.group, t + 3);
  }
  // 喵喵（店主持正面站姿）
  if (meowthMesh){ meowthMesh.userData.moving = false; animateModel(meowthMesh, t+7); }
  // 树果成熟微光
  waterT += dt;
  for (const [i,m] of cropMeshes){
    const c = game.crops[i];
    if (c && c.rem<=0 && m.userData.berry){
      m.userData.berry.scale.setScalar(0.2 + Math.sin(waterT*4 + i)*0.03);
    }
  }
  // 目标格高亮
  if (tileHighlight){
    let show = !inHouse && !menuOpen && !dialog;
    if (show){
      const [tx,ty] = facingTile();
      if (tx>=0 && ty>=0 && tx<MAP_W && ty<MAP_H){
        tileHighlight.position.x = worldX(tx+0.5);
        tileHighlight.position.z = worldZ(ty+0.5);
        tileHighlight.material.opacity = 0.2+0.1*Math.sin(t*3);
        tileHighlight.visible = true;
      } else show = false;
    }
    if (!show) tileHighlight.visible = false;
  }
  // 钓鱼浮漂 / 咬钩标记
  if (bobber){
    bobber.visible = !!fishing;
    if (fishing){
      bobber.position.set(worldX(fishing.tx+0.5), 0.05+Math.sin(t*3)*0.03, worldZ(fishing.ty+0.5));
      if (fishing.phase==='bite') bobber.position.y = 0.1+Math.abs(Math.sin(t*14))*0.12;
    }
  }
  if (biteMark){
    biteMark.visible = !!(fishing && fishing.phase==='bite');
    if (biteMark.visible){
      const pw2 = playerWorld();
      biteMark.position.set(pw2.x, 1.9+Math.sin(t*9)*0.1, pw2.z);
      biteMark.rotation.y += dt*2.5;
    }
  }
  updateAmbient(t);
  updateParticles(dt);
}
function playerWorld(){
  if (inHouse) return {x: player.x-INT_W/2, z: player.y-INT_H/2};
  return {x: worldX(player.x), z: worldZ(player.y)};
}

/* ---------------- 更新（模拟） ---------------- */
let timeHudShown = '';
function update(dt){
  if (!game || forceSleeping) return;
  game.time += 15*dt;
  if (game.time >= 26*60){
    game.time = 26*60;
    sfx('sleep');
    sleep(true);
    return;
  }
  if (fishing){
    fishing.t += dt;
    if (fishing.phase==='wait' && fishing.t>=fishing.biteAt){
      fishing.phase = 'bite'; sfx('splash');
      toast('❗ 咬钩了！快按 空格/E！');
    } else if (fishing.phase==='bite' && fishing.t>=fishing.biteAt+1.15+(hasSkill('angler')?0.8:0)){
      fishing = null; toast('鱼跑掉了…'); sfx('error');
    }
  }
  movePlayer(dt);
  updateNPCs(dt);
  const nowStr = fmtTime(game.time);
  if (nowStr !== timeHudShown){ timeHudShown = nowStr; updateHud(); updateFx(); }
}
function movePlayer(dt){
  if (dialog || menuOpen || fishing) return;
  let dx=0, dy=0;
  if (keys['arrowleft']||keys['a']) dx=-1;
  else if (keys['arrowright']||keys['d']) dx=1;
  if (keys['arrowup']||keys['w']) dy=-1;
  else if (keys['arrowdown']||keys['s']) dy=1;
  if (dx||dy){
    if (dx!==0) player.dir = dx>0?3:2;
    if (dy!==0) player.dir = dy>0?1:0;
    if (!player.moving){
      const cx = Math.floor(player.x), cy = Math.floor(player.y);
      const nx = cx+dx, ny = cy+dy;
      if (!isSolid(nx,ny)){ player.moving = true; player.mx = nx+0.5; player.my = ny+0.5; }
    }
  }
  if (player.moving){
    const baseSpd = 3.4 * (learnedWild('pidgey') ? 1.25 : 1); // 波波「顺风」
    const spd = ((keys['shift'] && hasSkill('dash')) ? baseSpd*1.6 : baseSpd)*dt; // 电光一闪冲刺
    const ax = player.mx - player.x, ay = player.my - player.y;
    const dist = Math.hypot(ax,ay);
    if (dist <= spd){ player.x = player.mx; player.y = player.my; player.moving = false; }
    else { player.x += ax/dist*spd; player.y += ay/dist*spd; player.walkT += dt; }
    player.stepT = (player.stepT||0) + dt;
    const stepGap = (keys['shift'] && hasSkill('dash')) ? 0.2 : 0.3;
    if (player.stepT >= stepGap){ player.stepT = 0; sfx('step'); }
  } else { player.walkT = 0; player.stepT = 0; }
}
function updateNPCs(dt){
  if (inHouse) return;
  for (const n of game.npcs){
    if (n.id==='snorlax') continue;
    if (n.wait>0){ n.wait -= dt; if (n.wait<=0) pickNPCTarget(n); continue; }
    if (!n.target){ n.wait = 1+Math.random()*3; continue; }
    const tx = n.target[0]+0.5, ty = n.target[1]+0.5;
    const ax = tx-n.x, ay = ty-n.y;
    const dist = Math.hypot(ax,ay);
    const spd = 2.2*dt;
    if (dist <= spd){ n.x = tx; n.y = ty; n.target = null; n.wait = 2+Math.random()*4; }
    else { n.x += ax/dist*spd; n.y += ay/dist*spd; }
  }
  // 野生宝可梦：小范围游走
  for (const w of game.wilds||[]){
    if (w.wait>0){ w.wait -= dt; if (w.wait<=0) pickWildTarget(w); continue; }
    if (!w.target){ w.wait = 1+Math.random()*2; continue; }
    const tx = w.target[0]+0.5, ty = w.target[1]+0.5;
    const ax = tx-w.x, ay = ty-w.y;
    const dist = Math.hypot(ax,ay);
    const spd = 1.4*dt;
    if (dist <= spd){ w.x = tx; w.y = ty; w.target = null; w.wait = 1.5+Math.random()*3; }
    else { w.x += ax/dist*spd; w.y += ay/dist*spd; }
  }
}
function pickWildTarget(w){
  for (let tries=0; tries<20; tries++){
    const x = Math.floor(w.x) + Math.floor(Math.random()*11)-5;
    const y = Math.floor(w.y) + Math.floor(Math.random()*11)-5;
    if (x<3||y<3||x>=MAP_W-3||y>=MAP_H-3) continue;
    if (isSolid(x,y)) continue;
    const i = idx(x,y);
    if (game.tile[i]!==T_GRASS || game.crops[i]) continue;
    w.target = [x,y];
    return;
  }
  w.wait = 2+Math.random()*3;
}
function pickNPCTarget(n){
  for (let tries=0; tries<40; tries++){
    const x = 4+Math.floor(Math.random()*(MAP_W-8));
    const y = 4+Math.floor(Math.random()*(MAP_H-8));
    if (!isSolid(x,y) && !npcAt(x,y)){ n.target = [x,y]; return; }
  }
  n.wait = 3+Math.random()*4;
}

/* ---------------- 主循环 ---------------- */
let lastFrame = 0;
function frame(now){
  const dt = Math.min(0.05, (now-lastFrame)/1000 || 0.016);
  lastFrame = now;
  try{
    update(dt);
    if (USE_PIXEL_2D){
      updateCamera2D(dt);
      render2D(now/1000);
    } else if (renderer){
      update3D(dt, now/1000);
      renderer.render(scene, camera);
    }
  }catch(e){
    // 渲染层异常不应杀死整个游戏循环；记录并继续
    console.error('[frame]', e);
    window.__frameErrs = (window.__frameErrs||[]);
    if (window.__frameErrs.length < 20) window.__frameErrs.push(e.message + ' @ ' + (e.stack||'').split('\n')[1]);
  }
  requestAnimationFrame(frame);
}

/* Game Boy 式控制甲板（画面下方黑色区域；触屏自动显示，#pad 桌面调试） */
function initTouch(){
  const ui = $('touchdeck');
  if (!ui) return;
  const isTouch = ('ontouchstart' in window) || (typeof navigator!=='undefined' && (navigator.maxTouchPoints||0) > 0);
  const force = typeof location!=='undefined' && location.hash==='#pad';
  if (!isTouch && !force) return;
  document.body.classList.add('has-pad');
  ui.classList.remove('hidden');
  const press = (el, on, off)=>{
    el.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); el.classList.add('on'); on(); });
    const end = e=>{ e.preventDefault(); el.classList.remove('on'); off && off(); };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointerleave', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('contextmenu', e=>e.preventDefault());
  };
  // 十字键 → 移动
  ui.querySelectorAll('#tdpad button').forEach(b=>{
    const k = b.dataset.k;
    press(b, ()=>{ keys[k] = true; }, ()=>{ keys[k] = false; });
  });
  // A 使用 / B 互动 / X 上一件 / Y 下一件
  const acts = {
    a: ()=>{ if (!menuOpen && !dialog && !forceSleeping) useSelected(); },
    b: ()=>{ if (!menuOpen && !dialog && !forceSleeping) interact(); },
    x: ()=>{ if (!menuOpen && !dialog) cycleSlot(-1); },
    y: ()=>{ if (!menuOpen && !dialog) cycleSlot(1); },
  };
  ui.querySelectorAll('#tbtns button').forEach(b=>{
    const fn = acts[b.dataset.act];
    if (fn) press(b, fn);
  });
}
function loadThree(onDone){
  if (typeof THREE !== 'undefined'){ onDone(true); return; }
  const head = document.head;
  if (!head){ return; } // 无 DOM（测试环境）
  const urls = [
    'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js',
    'https://unpkg.com/three@0.149.0/build/three.min.js',
    'https://cdn.bootcdn.net/ajax/libs/three.js/0.149.0/three.min.js',
  ];
  let i = 0, timer = 0;
  (function tryNext(){
    if (i >= urls.length){ onDone(false); return; }
    const s = document.createElement('script');
    let finished = false;
    const finish = (ok) => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      s.onload = s.onerror = null;
      if (ok) onDone(true);
      else { s.remove(); tryNext(); }
    };
    s.src = urls[i++];
    s.async = true;
    s.onload = ()=> finish(true);
    s.onerror = ()=> finish(false);
    timer = setTimeout(()=> finish(false), 8000); // 单个 CDN 超过 8 秒自动切换
    head.appendChild(s);
  })();
}

/* ---------------- 自测模式（URL 带 #selftest 触发） ----------------
   在浏览器内运行核心回归断言；开始前备份玩家存档，结束后原样恢复。 */
function runSelfTest(){
  const results = [];
  const ok = (cond, name)=>{ results.push((cond?'✓ ':'✗ FAIL ')+name); return cond; };
  const eq = (a,b,name)=> ok(a===b, name+'（got='+a+'，want='+b+'）');
  const rawSave = (()=>{ try{ return localStorage.getItem(SAVE_KEY); }catch(e){ return null; } })();
  const restore = ()=>{
    try{
      if (rawSave){ localStorage.setItem(SAVE_KEY, rawSave); loadGame(); }
      else { localStorage.removeItem(SAVE_KEY); newGame(); }
      updateHud(); renderHotbar(); refreshWorld3D(); snapCamera();
    }catch(e){}
  };
  try{
    newGame(); closeDialog();
    eq(game.season,'spring','新档季节为春季');
    eq(game.day,1,'新档第 1 天');
    eq(game.gold,START_GOLD,'初始金币 '+START_GOLD);
    // 移动：向上一步
    const y0 = player.y;
    keys['w'] = true; movePlayer(0.5); keys['w'] = false;
    ok(player.y < y0, '按 W 后向上移动');
    // 开垦 → 种植 → 浇水 → 催熟 → 收获 → 出售
    let tx=-1, ty=-1;
    for (let y=12;y<24 && tx<0;y++) for (let x=16;x<34;x++){
      const i = idx(x,y);
      if (game.tile[i]===T_GRASS && game.deco[i]===D_NONE && !game.crops[i]){ tx=x; ty=y; break; }
    }
    ok(tx>=0, '能找到可开垦的草地');
    selectSlot(0); useOnTile(tx,ty);
    eq(game.tile[idx(tx,ty)], T_TILLED, '锄头开垦成功');
    selectSlot(4); useOnTile(tx,ty);
    ok(!!game.crops[idx(tx,ty)], '种子种下成功');
    selectSlot(1); useOnTile(tx,ty);
    eq(game.watered[idx(tx,ty)], 1, '浇水成功');
    game.crops[idx(tx,ty)].rem = 0;
    selectSlot(8); useOnTile(tx,ty);
    eq(game.stats.harvested, 1, '收获树果 ×1');
    ok(game.inv.some(s=>s.id==='crop_oran' && s.n>0), '背包获得橙橙果');
    const gold0 = game.gold;
    sellItem('crop_oran');
    ok(game.gold>gold0, '出售后金币增加（'+gold0+'→'+game.gold+'）');
    ok(game.guide.sell===1, '引导清单记录出售步骤');
    // 过天与换季
    advanceDay(false);
    eq(game.day, 2, '过天后进入第 2 天');
    game.day = DAYS_PER_SEASON; advanceDay(false);
    eq(game.season, 'summer', '季节推进到夏季');
    // 存读档往返
    saveGame();
    const goldSnap = game.gold;
    game.gold = 1;
    loadGame();
    eq(game.gold, goldSnap, '读档恢复金币');
    // 恢复玩家原始存档
    restore();
  }catch(e){
    results.push('✗ FAIL 自测异常：'+e.message);
    restore();
  }
  const pass = results.filter(r=>r.startsWith('✓')).length;
  const fail = results.length - pass;
  showDialog('<h3>🧪 自测结果：'+pass+' 通过，'+fail+' 失败</h3><pre style="white-space:pre-wrap;font-size:13px;line-height:1.9">'
    + results.join('\n') + '</pre>',
    [{label:'关闭', ghost:true, fn:closeDialog}]);
  console.log('[selftest]', results.join('\n'));
}
if (typeof location!=='undefined' && location.hash==='#selftest'){
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', ()=>setTimeout(runSelfTest, 300));
  else setTimeout(runSelfTest, 300);
}
/* 像素图鉴（#pixelart）：列出全部精灵×三向的原始像素图，便于校对 */
function showPixelGallery(){
  let html = '<h3>🎨 像素精灵图鉴（前 / 后 / 侧）</h3><div style="display:flex;flex-wrap:wrap;gap:14px">';
  for (const id in PIXEL_ART){
    html += '<div style="text-align:center"><b style="font-size:12px">'+(FORM_NAMES[id]||id)+'</b><br>';
    for (const dirName of ['front','back','side']){
      const cnv = pxCanvas(id, dirName, 0);
      const img = document.createElement('canvas');
      img.width = 96; img.height = 96;
      const ictx = img.getContext('2d');
      ictx.imageSmoothingEnabled = false;
      ictx.drawImage(cnv, 0, 0, 96, 96);
      html += '<img src="'+img.toDataURL()+'" style="image-rendering:pixelated;width:48px;height:48px;background:#8a8;margin:1px" title="'+dirName+'">';
    }
    html += '</div>';
  }
  html += '</div>';
  showDialog(html, [{label:'关闭', ghost:true, fn:closeDialog}]);
}
if (typeof location!=='undefined' && location.hash==='#pixelart'){
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', ()=>setTimeout(showPixelGallery, 300));
  else setTimeout(showPixelGallery, 300);
}
